}

/**
 * L'accueil : ce que pèse la semaine, où aller, et ce qui presse.
 *
 * Il suit le filtre en cours — onglet et famille — si bien que « Sports »
 * n'est pas une liste mais une vue d'ensemble du sport.
 */
function rendreAccueil() {
  const vue = document.getElementById("vue");
  const liste = fiches();
  if (!liste.length) {
    vue.replaceChildren(el("p", { class: "vide",
      text: famille ? "Aucune promotion dans cette famille." : "Aucune promotion." }));
    return;
  }

  const pot = liste.reduce((s, f) => s + (f.regles?.cagnotte_usd || 0), 0);
  const gens = new Set();
  let parts = 0;
  for (const f of liste) {
    parts += f.classement?.participations || 0;
    for (const x of f.classement?.lignes || []) gens.add(x.pseudo);
  }
  const nomFamille = famille ? FAMILLES.find((x) => x[0] === famille)[1] : null;
  const prochaine = liste
    .map((f) => Date.parse(f.fin_le || ""))
    .filter((t) => isFinite(t) && t > Date.now())
    .sort((a, b) => a - b)[0];

  const morceaux = [];
  morceaux.push(el("div", { class: "entete accueil" },
    el("div", { class: "haut" },
      el("div", { class: "titraille" },
        el("p", { class: "fil", text: tr(filtre === "live" ? "en_cours_sur_le_forum" : "recemment_terminees") }),
        el("h2", { text: nomFamille ? tr(nomFamille) : tr("toutes_les_familles") }),
        el("p", { class: "critere" },
          tr("resume_accueil", nf.format(liste.length), nf.format(parts), nf.format(gens.size)),
          prochaine ? " · " + tr("prochaine_dans") + " " : null,
          prochaine
            ? el("b", { text: reste(new Date(prochaine).toISOString()) })
            : null)),
      el("div", { class: "pot" },
        el("span", { class: "somme", text: argent(pot) }),
        el("span", { class: "etiquette", text: tr("en_jeu") })))));

  if (!famille) {
    morceaux.push(el("div", { class: "portes" }, FAMILLES.map(([cle, nom]) => {
      const dedans = liste.filter((f) => famillesDe(f).includes(cle));
      if (!dedans.length) return null;
      const p = dedans.reduce((s, f) => s + (f.regles?.cagnotte_usd || 0), 0);
      return el("a", {
        class: "porte",
        href: "#/c/" + cle + (filtre === "terminees" ? "/terminees" : ""),
      },
        el("div", { class: "nom" }, el("span", { text: tr(nom) }), el("span", { class: "fleche", text: "→" })),
        el("div", { class: "combien", text: tr(pl(dedans.length, "n_promotion", "n_promotions"), nf.format(dedans.length)) }),
        el("div", { class: "sous", text: tr("x_en_jeu", argent(p)) }));
    })));
  }

  // Au-dessous de six, les deux rangées montreraient les mêmes cartes : une
  // famille de trois promotions n'a pas de « plus grosses cagnottes »
  // distinctes de ses « premières échéances ».
  const avecFin = liste.filter((f) => isFinite(Date.parse(f.fin_le || "")));
  if (liste.length <= 6) {
    const ordre = [...liste].sort((a, b) =>
      (Date.parse(a.fin_le || "") || Infinity) - (Date.parse(b.fin_le || "") || Infinity));
    morceaux.push(el("h3", { class: "section",
      text: tr(pl(liste.length, "les_n_promotion", "les_n_promotions"), nf.format(liste.length)) }));
    morceaux.push(el("div", { class: "cartes" }, ordre.map(carteP)));
    vue.replaceChildren(...morceaux.filter(Boolean));
    window.scrollTo(0, 0);
    return;
  }
  if (filtre === "live" && avecFin.length) {
    const bientot = [...avecFin].sort((a, b) => Date.parse(a.fin_le) - Date.parse(b.fin_le)).slice(0, 6);
    morceaux.push(el("h3", { class: "section", text: tr("ce_qui_ferme_en_premier") }));
    morceaux.push(el("div", { class: "cartes" }, bientot.map(carteP)));
  } else if (avecFin.length) {
    const recentes = [...avecFin].sort((a, b) => Date.parse(b.fin_le) - Date.parse(a.fin_le)).slice(0, 6);
    morceaux.push(el("h3", { class: "section", text: tr("terminees_en_dernier") }));
    morceaux.push(el("div", { class: "cartes" }, recentes.map(carteP)));
  }

  const grosses = [...liste]
    .sort((a, b) => (b.regles?.cagnotte_usd || 0) - (a.regles?.cagnotte_usd || 0))
    .slice(0, 6);
  if (grosses.length) {
    morceaux.push(el("h3", { class: "section", text: tr("les_plus_grosses_cagnottes") }));
    morceaux.push(el("div", { class: "cartes" }, grosses.map(carteP)));
  }

  vue.replaceChildren(...morceaux.filter(Boolean));
  window.scrollTo(0, 0);
}

/**
 * Dans quel paquet ranger une promotion, quand on trie par échéance.
 *
 * Le forum les range par section, ce qui n'aide personne : « Limited-Time »
 * ne dit ni ce qui ferme ce soir ni ce qui a encore six jours. L'échéance,
 * elle, est la seule chose qu'on regarde avant de décider de jouer.
 */
function paquet(f) {
  const t = Date.parse(f.fin_le || "");
  if (!isFinite(t)) return ["grp_sans", 4, false];
  const h = (t - Date.now()) / 3600000;
  if (h <= 0) return ["grp_terminees", 3, false];
  if (h < 24) return ["grp_aujourdhui", 0, true];
  if (h < 24 * 7) return ["grp_semaine", 1, false];
  return ["grp_plus_tard", 2, false];
}

/** Le filet de gauche : ce que la promotion vaut comme lecture. */
function couleurEntree(f) {
  const t = f.regles?.type_classement;
  if (f.classement?.classable) return "classe";
  if (t === "random") return "hasard";
  return "";
}

function rendreBarre() {
  const barre = document.getElementById("barre");
  const champ = el("input", {

  const boutonsTri = el("div", { class: "tri", role: "group", "aria-label": tr("trier") },
    ...[["echeance", "tri_echeance"], ["cagnotte", "tri_cagnotte"], ["monde", "tri_joueurs"]].map(([cle, nom]) =>
      el("button", {
        "aria-pressed": String(tri === cle),
        onclick: () => { tri = cle; rendreBarre(); },
      }, tr(nom))));

  const boutonsFamille = el("div", { class: "familles", role: "group", "aria-label": tr("famille_de_jeu") },

    }));

  const entete = el("div", {}, resumeBarre(), boutonsFamille,

  const mot = pliage(filtreListe);

    (f) => !mot || pliage(f.titre).includes(mot) || pliage(f.categorie).includes(mot));
  if (!liste.length) {
    barre.replaceChildren(entete, el("p", { class: "vide", style: "padding:16px",
      text: famille ? "Aucune promotion dans cette famille." : "Aucune promotion." }));
    if (filtreListe) champ.focus();

  }

  const entree = (f) => {
    const c = f.classement || {};

    return el("a", {
      class: "entree " + couleurEntree(f),
      href: "#/p/" + f.id,
      "aria-current": !joueur && choisie && f.id === choisie.id ? "true" : "false",
    },
      el("span", { class: "haut-e" },
        el("span", { class: "nom", text: f.titre }),
        fin ? el("span", { class: "quand" + (presse(f.fin_le) ? " urgent" : ""), text: fin }) : null),
      el("span", { class: "meta" },
        el("span", { class: "pot", text: argent(f.regles?.cagnotte_usd ?? null) }),
        el("span", { text: tr("n_entrees", nf.format(c.participations || 0)) }),
        el("span", { class: "ou", text: f.categorie || "" })));
  };

  const morceaux = [entete];
  if (tri === "echeance") {
    // Groupé, parce que l'échéance a des paliers qui veulent dire quelque
    // chose. Les autres tris n'en ont pas : une liste ordonnée suffit.
    const paquets = new Map();
    for (const f of liste) {
      const [nom, rang, chaud] = paquet(f);
      if (!paquets.has(nom)) paquets.set(nom, { rang, chaud, gens: [] });
      paquets.get(nom).gens.push(f);
    }
    for (const [nom, p] of [...paquets.entries()].sort((a, b) => a[1].rang - b[1].rang)) {
      p.gens.sort((a, b) => (Date.parse(a.fin_le || "") || Infinity) - (Date.parse(b.fin_le || "") || Infinity));
      morceaux.push(el("div", { class: "groupe-titre" + (p.chaud ? " chaud" : "") },
        el("span", { text: tr(nom) }), el("span", { class: "compte", text: String(p.gens.length) })));
      morceaux.push(...p.gens.map(entree));
    }
  } else {

      ? (a, b) => (b.regles?.cagnotte_usd || 0) - (a.regles?.cagnotte_usd || 0)
      : (a, b) => (b.classement?.participations || 0) - (a.classement?.participations || 0));
    morceaux.push(el("div", { class: "groupe-titre" },
      el("span", { text: tr(tri === "cagnotte" ? "tri_grosse" : "tri_monde") }),
      el("span", { class: "compte", text: String(trie.length) })));
    morceaux.push(...trie.map(entree));
  }

  barre.replaceChildren(...morceaux);
  if (filtreListe) { champ.focus(); champ.setSelectionRange(champ.value.length, champ.value.length); }
}

/** Le contexte, en tête de barre : ce que pèse la semaine, en deux lignes. */

// ── Les bandes de prix ───────────────────────────────────────────────────
function bandes(f) {
  const out = [];
  for (const p of f.regles?.prix || []) {
    out.push({
      debut: p.rang_debut,
      fin: p.jusqu_au_bout ? Infinity : p.rang_fin,
      montant: p.montant,
      partage: !!p.partage,
      ouverte: !!p.jusqu_au_bout,
    });
  }
  const pp = f.classement?.part_partagee;
  if (pp && !out.length) {
    out.push({ debut: pp.depuis_le_rang, fin: Infinity, montant: pp.cagnotte, partage: true, ouverte: true });
  }
  out.sort((a, b) => a.debut - b.debut);
  return out;
}

function libelleBande(b, pp) {
  // Une bande qui part de la première place ne désigne pas un rang : elle
  // désigne tout le monde.
  const places = b.ouverte
    ? (b.debut <= 1 ? tr("tous_participants") : tr("rang_et_au_dela", ordinal(b.debut)))
    : b.debut === b.fin ? ordinal(b.debut) : tr("rang_a_rang", ordinal(b.debut), ordinal(b.fin));
  if (b.partage) {
    const part = pp && pp.depuis_le_rang === b.debut ? pp.part : null;
    return [places, "part de " + argent(b.montant), part !== null ? "≈ " + argent(part) + " chacun" : null];
  }
  return [places, argent(b.montant) + " chacun"];
}

/**
 * La course, graduée.
 *
 * « 3 h » ne dit pas si la promotion a ouvert hier ou il y a six jours, ni
 * s'il reste un dixième ou la moitié du temps. Un cran par jour, la portion
 * écoulée encrée, un curseur sur maintenant : on lit la course entière d'un
 * coup d'œil, et le dernier jour se voit venir.
 *
 * Les crans sont posés en pourcentage plutôt qu'en SVG — la barre doit
 * suivre la largeur de la colonne, et un viewBox étiré déformerait les
 * chiffres des bornes.
 */
function jauge(f) {
  const debut = Date.parse(f.regles?.debut_le || f.ouvert_le || "");
  const fin = Date.parse(f.fin_le || "");
  if (!isFinite(debut) || !isFinite(fin) || fin <= debut) return null;

  const duree = fin - debut;
  const part = Math.min(1, Math.max(0, (Date.now() - debut) / duree));
  const jour = (ms) => new Date(ms).toLocaleString(codeLangue(),
    { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });

  // Un cran par jour, à minuit. Au-delà d'un mois ils se toucheraient : on
  // passe à la semaine, et le cran fort marque alors le lundi.
  const JOUR = 86400000;
  const pas = duree > 40 * JOUR ? 7 * JOUR : JOUR;
  const crans = [];
  const premier = new Date(debut);
  premier.setHours(0, 0, 0, 0);
  for (let t = premier.getTime() + pas; t < fin; t += pas) {
    if (t <= debut) continue;
    const d = new Date(t);
    crans.push(el("i", {
      class: "cran" + (d.getDay() === 1 ? " fort" : ""),
      style: "left:" + ((t - debut) / duree * 100).toFixed(3) + "%",
    }));
  }

  const reste_ = reste(f.fin_le);
  return el("div", { class: "chrono" + (presse(f.fin_le) ? " presse" : "") },
    el("div", { class: "axe" },
      ...crans,
      el("div", { class: "ecoule", style: "width:" + (part * 100).toFixed(3) + "%" }),
      part < 1
        ? el("div", {
            class: "curseur" + (part > .88 ? " au-bout" : part < .12 ? " au-debut" : ""),
            style: "left:" + (part * 100).toFixed(3) + "%",
          },
            reste_ ? el("span", { text: reste_ }) : null, el("i", {}))
        : null),
    el("div", { class: "bornes" },
      el("span", { text: tr("ouverte_le") + " " + jour(debut) }),
      el("span", { class: "fin", text: tr(fin > Date.now() ? "ferme_le" : "fermee_le") + " " + jour(fin) })));
}

const stat = (nom, valeur, argentP, mot) =>
  el("div", { class: "stat" },
    el("span", { class: "etiquette", text: nom }),
    el("span", { class: "valeur" + (argentP ? " argent" : mot ? " mot" : ""), text: valeur }));

const puce = (nom, valeur) => el("span", { class: "puce" }, nom + " ", el("b", { text: valeur }));

/** Copier l'adresse de cette promotion, pour l'envoyer à quelqu'un. */
function boutonLien(f) {
  const b = el("button", { class: "lien-promo", text: tr("copier_le_lien") });
  b.addEventListener("click", async () => {
    const url = location.origin + location.pathname + "#/p/" + f.id;
    try { await navigator.clipboard.writeText(url); } catch (e) {
      // Pas de presse-papiers — page non sécurisée, permission refusée :
      // montrer l'adresse vaut mieux que ne rien faire.
      window.prompt(tr("adresse_de_cette"), url);
      return;
    }
    b.textContent = tr("lien_copie");
    b.classList.add("fait");
    setTimeout(() => { b.textContent = "copier le lien"; b.classList.remove("fait"); }, 2000);
  });
  return b;
}

/**
 * Un encart repliable.
 *
 * Trois pavés dépliés repoussaient le classement sous la ligne de flottaison.
 * Le titre porte l'essentiel — « Tous les participants : 18,48 $ chacun » se
 * suffit — et le détail attend qu'on le demande. Sauf une alerte : une

function avis(titre, corps, ouvert, alerte) {

/**

 *
 * C'est ainsi qu'on lit un résultat : d'abord qui gagne, ensuite le détail.
 * Le tableau seul les noyait parmi trois cents lignes de même graisse.
 */
function podium(f) {
  const c = f.classement || {};

      el("div", { class: "qui" },

      el("div", { class: "quoi", text: l.affichage || "—" }))));

  morceaux.push(el("div", { class: "entete" },

          " · ", boutonLien(f))),
      el("div", { class: "pot" },
        el("span", { class: "somme", text: argent(r.cagnotte_usd ?? null) }),
        el("span", { class: "etiquette", text: "cagnotte" }))),
    jauge(f),
    el("div", { class: "stats" },
      stat(tr("st_participations"), nf.format(c.participations || 0)),
      stat(tr("st_joueurs"), nf.format(c.joueurs || 0)),
      stat(tr("st_se_termine"), reste(f.fin_le) || "—"),
      c.resolues ? stat(tr("st_paris_lus"), nf.format(c.resolues)) : null)));

  const puces = [];
  const fam = famillesDe(f);
  if (fam.length) {
    puces.push(puce(tr(fam.length > 1 ? "p_familles" : "p_famille"),
      fam.map((c) => tr(FAMILLES.find((x) => x[0] === c)[1])).join(" · ")));
  }
  if (e.jeux?.length) puces.push(puce(tr("machine"), e.jeux.join(" · ")));
  if (e.multiplicateur_minimum != null) puces.push(puce(tr("p_multiplicateur"), "≥ " + nf.format(e.multiplicateur_minimum) + "x"));
  if (e.mise_minimum_usd != null) puces.push(puce(tr("p_mise"), "≥ " + argent(e.mise_minimum_usd)));
  if (e.cote_minimum != null) puces.push(puce(tr("p_cote"), "≥ " + nf.format(e.cote_minimum)));
  if (e.participations_par_joueur != null) puces.push(puce(tr("p_par_joueur"), tr(pl(e.participations_par_joueur, "n_participation", "n_participations"), e.participations_par_joueur)));
  if (e.bet_id_unique) puces.push(puce("Bet ID", tr("un_seul_par_fil")));
  if (e.rang_vip) puces.push(puce(tr("p_rang_vip"), e.rang_vip));
  if (e.kyc_requis) puces.push(puce(tr("p_identite"), tr("verifiee")));
  if (e.messages_forum_minimum != null) puces.push(puce("Forum", tr("p_messages", e.messages_forum_minimum)));
  if (e.achats_de_bonus_interdits) puces.push(puce(tr("p_achats_bonus"), tr("p_interdits")));
  if (puces.length) morceaux.push(el("div", { class: "regles" }, puces));

  // Ce que la promotion dit de son propre classement. Avant tout le reste :
  // sans cette phrase, quelqu'un se croit premier.
  if (r.reserve) {
    morceaux.push(avis(tr("ce_classement_est_provisoire"), [el("p", { text: r.reserve })], true, true));
  }

  if (pp) {
    const tous = pp.depuis_le_rang <= 1;
    morceaux.push(avis(tous
      ? tr("partage_tous", argent(pp.part))
      : tr("partage_au_dela", ordinal(pp.depuis_le_rang), argent(pp.part)), [
      el("p", {},
        tr("partage_entre", argent(pp.cagnotte), nf.format(pp.beneficiaires)) +
        (tous ? " joueur" : " place") + (pp.beneficiaires > 1 ? "s" : "") + ". ",
        tous
          ? tr("ne_classe_personne")
          : tr("partage_suppose_egal")),
      pp.palier_suivant
        ? el("p", {},
            tr("palier_suivant", ordinal(pp.palier_suivant.participants),
              argent(pp.palier_suivant.cagnotte)) + " ",
            el("span", { class: "fort", text: argent(pp.palier_suivant.part) + " chacun" }),
            pp.palier_suivant.part < pp.part ? ", donc moins qu'aujourd'hui." : ", donc davantage.")
        : null,
      el("p", { text: tr("le_rang_vip_et_la") }),
    ]));
  }

  if (!c.classable && c.obstacle) {
    morceaux.push(avis(tr("aucun_classement_n_est_calcule"), [
      el("p", { text: c.obstacle }),
      c.lignes?.length
        ? el("p", { text: tr("ordre_d_arrivee", nf.format(c.lignes.length)) })
        : null,
    ], true));
  }

  const tete = podium(f);
  if (tete) {
    morceaux.push(el("h3", { class: "section", text: tr("en_tete") }));
    morceaux.push(tete);
  }
  morceaux.push(el("h3", { class: "section",
    text: tr(c.classable ? "classement_estime" : "participations") }));
  morceaux.push(tableau(f));

  vue.replaceChildren(...morceaux.filter(Boolean));
}

// ── Le tableau d'une promotion ───────────────────────────────────────────
function mouvement(l) {
  if (l.nouveau) return el("span", { class: "mouv neuf", text: "NEW" });
  if (typeof l.variation !== "number" || l.variation === 0) return el("span", {});
  const monte = l.variation > 0;
  return el("span", { class: "mouv " + (monte ? "monte" : "baisse"), text: (monte ? "▲" : "▼") + Math.abs(l.variation) });
}

function rangee(l, paye, cible, largeur) {
  const [libelle, classe] = ETATS[l.validite] || ["—", "etat-inconnu"];
  return el("tr", { class: cible && pliage(l.pseudo) === cible ? "moi" : null },
    el("td", { class: "num mono" }, String(l.rang), " ", mouvement(l)),
    el("td", { class: "pseudo" },
      el("button", {
        class: "lien-nu",
        title: tr("voir_toutes_les_promotions_de") + l.pseudo,
        onclick: () => chercherJoueur(l.pseudo),
      }, l.pseudo),
      // Stake annonce ses gagnants sous leur pseudo de casino, qui n'est pas
      // toujours celui du forum : « NurEinentenner » y poste sous
      // « NurEinenZehner ». Sans ce rappel, comparer les deux classements
      // donne l'impression de deux listes differentes la ou ce sont les
      // memes gens.
      l.pseudo_stake && pliage(l.pseudo_stake) !== pliage(l.pseudo)
        ? el("span", { class: "chez-stake", title: tr("chez_stake"), text: l.pseudo_stake })
        : null),
    el("td", { class: "num mesure" },
      el("span", { class: "v", text: l.affichage || "—" }),
      el("span", { class: "trait" }, el("i", { style: "width:" + largeur(l.valeur) + "%" }))),
    el("td", { class: "doux machine", title: l.jeu || "", text: l.jeu || "—" }),
    el("td", { class: "betid", title: (l.bet_ids || []).join(" "), text: (l.bet_ids || []).join(" ") || "—" }),
    el("td", { class: "doux mono", text: heure(l.poste_le) }),
    el("td", { class: classe, text: libelle }),
    paye ? el("td", { class: "num argent mono", text: l.prix_estime == null ? "—" : argent(l.prix_estime) }) : null);
}

function tableau(f) {
  const c = f.classement || {};
  const lignes = c.lignes || [];
  if (!lignes.length) return el("p", { class: "vide", text: tr("aucune_participation_relevee") });

  const bs = bandes(f);
  const pp = c.part_partagee;
  const paye = c.classable || !!pp;
  // Les promotions à Rift ne se dotent pas au rang général : leur barème
  // s'applique à la place dans le Rift. Des bandes par rang y annonçaient
  // « au-delà du barème » juste au-dessus de lignes à cent dollars.
  const parRift = (f.regles?.type_classement || "") === "derniers_avant_jalon";
  const dotation = bs.map((b) => argent(b.montant)).join(" · ");

  // L'échelle des mesures, en logarithme : de dix à vingt-six mille, une
  // échelle linéaire collerait tout le peloton contre la gauche.
  const valeurs = lignes.map((l) => l.valeur).filter((v) => typeof v === "number" && v > 0);
  const haut = valeurs.length ? Math.log(Math.max(...valeurs)) : 1;
  const bas = valeurs.length ? Math.log(Math.min(...valeurs)) : 0;
  const largeur = (v) => {
    if (typeof v !== "number" || v <= 0 || haut === bas) return 0;
    return Math.max(2, Math.round(((Math.log(v) - bas) / (haut - bas)) * 100));
  };

  // La ligne cherchée entre dans ce qu'on montre, même au-delà du seuil : on
  // ne va pas demander à quelqu'un de déplier trois cents lignes pour se
  // trouver.
  const cible = surligne ? pliage(surligne) : null;
  let montrees = toutMontrer ? lignes : lignes.slice(0, PAR_DEFAUT);
  if (cible && !montrees.some((l) => pliage(l.pseudo) === cible)) {
    montrees = montrees.concat(lignes.filter((l) => pliage(l.pseudo) === cible));
  }

  const corps = [];
  let bande = -1;
  for (const l of montrees) {
    if (parRift) {
      const m = /^Rift (\d+)/.exec(l.affichage || "");
      const cle = m ? m[1] : "—";
      if (cle !== bande) {
        bande = cle;
        corps.push(el("tr", { class: "bande" },
          el("td", { colspan: 8 }, m
            ? [el("span", { class: "dot", text: tr("rift") + cle }), dotation ? " · " + dotation : ""]
            : [el("span", { class: "doux", text: tr("aucun_rift_ouvert_apres_ces") })])));
      }
      corps.push(rangee(l, paye, cible, largeur));
      continue;
    }
    // La frontière d'argent, posée juste avant la première place qu'elle
    // couvre. C'est ce qu'un tableau de noms ne dit jamais.
    const k = bs.findIndex((b) => l.rang >= b.debut && l.rang <= b.fin);
    if (paye && k !== bande) {
      bande = k;
      if (k >= 0) {
        const [places, ...suite] = libelleBande(bs[k], pp);
        corps.push(el("tr", { class: "bande" },
          el("td", { colspan: 8 }, places, " · ",
            ...suite.filter(Boolean).map((x, i) => el("span", { class: i === 0 ? "dot" : "doux" }, (i ? " · " : "") + x)))));
      } else {
        corps.push(el("tr", { class: "bande" },
          el("td", { colspan: 8, class: "doux", text: tr("au_dela_du_bareme_aucun") })));
      }
    }
    corps.push(rangee(l, paye, cible, largeur));
  }

  const t = el("table", {},
    el("thead", {}, el("tr", {},
      el("th", { class: "num", text: c.classable ? tr("rang") : "#" }),
      el("th", { text: tr("joueur") }),
      el("th", { class: "num", text: tr("resultat") }),
      el("th", { text: tr("machine") }),
      el("th", { text: "Bet ID" }),
      el("th", { text: tr("publie") }),
      el("th", { text: tr("etat") }),
      paye ? el("th", { class: "num", text: tr("prix_estime") }) : null)),
    el("tbody", {}, corps));

  // Le bouton reste hors du conteneur défilant : sur un téléphone il doit
  // tomber sous le tableau, pas partir avec lui vers la droite.
  if (lignes.length > montrees.length) {
    return el("div", {}, el("div", { class: "defile" }, t), el("button", {
      class: "plus",
      onclick: () => { toutMontrer = true; rendreFiche(f); },
    }, tr("voir_les_autres", nf.format(lignes.length - montrees.length))));
  }
  return el("div", { class: "defile" }, t);
}

// ── La recherche de joueur ───────────────────────────────────────────────
//
// Ce que quelqu'un vient chercher ici, c'est son propre nom : où il en est,
// dans combien de promotions, et ce que ça lui rapporterait. Parcourir vingt
// tableaux pour le savoir n'a aucun sens — sept cent trente-neuf joueurs se
// partagent les promotions en cours, et quatre-vingt-trois sont dans six
// fils ou plus.
function joueursConnus(mot) {
  const m = pliage(mot);
  const par = new Map();
  for (const f of toutesLesFiches()) {
    for (const l of f.classement?.lignes || []) {
      if (m && !pliage(l.pseudo).includes(m)) continue;
      par.set(l.pseudo, (par.get(l.pseudo) || 0) + 1);
    }
  }
  return [...par.entries()]
    // Celui qui commence par ce qu'on tape d'abord, puis le plus présent.
    .sort((a, b) => {
      const pa = pliage(a[0]).startsWith(m) ? 0 : 1;
      const pb = pliage(b[0]).startsWith(m) ? 0 : 1;
      return pa - pb || b[1] - a[1] || a[0].localeCompare(b[0]);
    })
    .slice(0, 40);
}

function chercherJoueur(pseudo) {
  joueur = pseudo;
  surligne = pseudo;
  ecrireAdresse();
  document.getElementById("q").value = pseudo;
  fermerSuggestions();
  rendreBarre();
  rendreJoueur(pseudo);
  window.scrollTo(0, 0);
}

function quitterJoueur() {
  joueur = null;
  surligne = null;
  document.getElementById("q").value = "";
  ecrireAdresse();
  rendre();
}

/** Choisir une famille, c'est choisir une liste : l'adresse la désigne. */
function poserFamille(valeur) {
  famille = valeur;
  choisie = null;
  joueur = null;
  surligne = null;
  document.getElementById("q").value = "";
  ecrireAdresse();
  rendre();
}

function rendreJoueur(pseudo) {
  const vue = document.getElementById("vue");
  const cible = pliage(pseudo);
  const trouvees = [];
  for (const [ou, liste] of [["en cours", jeux.live], ["terminée", jeux.terminees]]) {
    for (const f of liste) {
      for (const l of f.classement?.lignes || []) {
        if (pliage(l.pseudo) === cible) trouvees.push({ f, l, ou });
      }
    }
  }
  const tete = el("div", { class: "joueur-tete" },
    el("h2", { text: pseudo }),
    el("button", { onclick: quitterJoueur }, tr("retour_promotions")));

  if (!trouvees.length) {
    vue.replaceChildren(tete, el("p", { class: "vide", text: tr("aucune_participation_relevee_sous_ce2") }));
    return;
  }

  const gains = trouvees.reduce((s, x) => s + (x.l.prix_estime || 0), 0);
  const payantes = trouvees.filter((x) => x.l.prix_estime).length;

  vue.replaceChildren(
    tete,
    el("div", { class: "semaine" },
      bloc(tr("bl_promotions"), nf.format(trouvees.length)),
      bloc(tr("bl_places_payantes"), nf.format(payantes)),
      bloc(tr("bl_gains_estimes"), argent(gains), "argent")),
    el("div", { class: "avis" },
      el("p", { text: tr("ces_montants_sont_des_estimations") })),
    el("h3", { class: "section", text: tr("ses_participations") }),
    tableauJoueur(trouvees));
}

function tableauJoueur(trouvees) {
  trouvees.sort((a, b) => (b.l.prix_estime || 0) - (a.l.prix_estime || 0) || a.l.rang - b.l.rang);
  return el("div", { class: "defile" }, el("table", {},
    el("thead", {}, el("tr", {},
      el("th", { text: tr("promotion") }),
      el("th", { class: "num", text: tr("place") }),
      el("th", { class: "num", text: tr("resultat") }),
      el("th", { text: tr("machine") }),
      el("th", { text: tr("etat") }),
      el("th", { text: tr("fil") }),
      el("th", { class: "num", text: tr("prix_estime") }))),
    el("tbody", {}, trouvees.map(({ f, l, ou }) => {
      const [libelle, classe] = ETATS[l.validite] || ["—", "etat-inconnu"];
      const c = f.classement || {};
      return el("tr", {},
        el("td", {},
          el("button", {
            class: "lien-nu",
            style: "font-weight:500",
            onclick: () => {
              // Le filtre suit la promotion : sans ça, ouvrir une terminée
              // depuis la vue joueur donnerait une barre qui ne la contient
              // pas, et une sélection invisible.
              poserFiltre(ou === "en cours" ? "live" : "terminees");
              surligne = l.pseudo;
              montrerFiche(f);
            },
          }, f.titre),
          el("div", { class: "doux", style: "font-size:11.5px", text: ou + " · " + (f.categorie || "") })),
        el("td", { class: "num mono", text: c.classable ? String(l.rang) : "—" }),
        el("td", { class: "num mono", text: l.affichage || "—" }),
        el("td", { class: "doux machine", title: l.jeu || "", text: l.jeu || "—" }),
        el("td", { class: classe, text: libelle }),
        el("td", {}, f.url ? el("a", { href: f.url, target: "_blank", rel: "noopener", text: "ouvrir" }) : "—"),
        el("td", { class: "num argent mono", text: l.prix_estime == null ? "—" : argent(l.prix_estime) }));
    }))));
}

// ── Les suggestions ──────────────────────────────────────────────────────
let choixSuggestion = -1;
function fermerSuggestions() {
  const d = document.getElementById("suggestions");
  d.hidden = true;
  d.replaceChildren();
  choixSuggestion = -1;
}
function ouvrirSuggestions(mot) {
  const d = document.getElementById("suggestions");
  if (!mot || mot.length < 2) return fermerSuggestions();
  const trouves = joueursConnus(mot);
  d.className = "suggestions";
  d.hidden = false;
  choixSuggestion = -1;
  if (!trouves.length) {
    d.replaceChildren(el("p", { class: "rien", text: tr("aucun_joueur_de_ce_nom2") }));
    return;
  }
  d.replaceChildren(...trouves.map(([nom, n]) =>
    el("button", { onclick: () => chercherJoueur(nom) },
      el("span", { text: nom }),
      el("span", { class: "compte", text: n + (n > 1 ? " promos" : " promo") }))));
}

const q = document.getElementById("q");
let minuteur = null;
q.addEventListener("input", () => {
  clearTimeout(minuteur);
  minuteur = setTimeout(() => ouvrirSuggestions(q.value.trim()), 130);
});
q.addEventListener("keydown", (ev) => {
  const boutons = [...document.querySelectorAll("#suggestions button")];
  if (ev.key === "Escape") { q.value = ""; fermerSuggestions(); q.blur(); return; }
  if (!boutons.length) {
    if (ev.key === "Enter" && q.value.trim()) chercherJoueur(q.value.trim());
    return;
  }
  if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
    ev.preventDefault();
    choixSuggestion = (choixSuggestion + (ev.key === "ArrowDown" ? 1 : boutons.length - 1)) % boutons.length;
    boutons.forEach((b, i) => b.setAttribute("aria-selected", String(i === choixSuggestion)));
    boutons[choixSuggestion].scrollIntoView({ block: "nearest" });
  } else if (ev.key === "Enter") {
    ev.preventDefault();
    (boutons[choixSuggestion] || boutons[0]).click();
  }
});
document.addEventListener("click", (ev) => {
  if (!ev.target.closest(".chercher")) fermerSuggestions();
});
// « / » ouvre la recherche : le raccourci que tout le monde essaie.
document.addEventListener("keydown", (ev) => {
  if (ev.key === "/" && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) {
    ev.preventDefault();
    q.focus();
    q.select();
  }
});

// ── Les commandes ────────────────────────────────────────────────────────
function poserFiltre(valeur) {
  filtre = valeur;
  for (const [id, v] of [["f-live", "live"], ["f-terminees", "terminees"]]) {
    document.getElementById(id).setAttribute("aria-pressed", String(valeur === v));
  }
}
document.getElementById("plier").addEventListener("click", () => document.body.classList.toggle("replie"));
for (const [id, valeur] of [["f-live", "live"], ["f-terminees", "terminees"]]) {
  document.getElementById(id).addEventListener("click", () => {
    poserFiltre(valeur);
    // Le choix change ce qu'on regarde : la fiche ouverte n'a plus de raison
    // de l'être, et garder son nom afficherait une promotion absente.
    choisie = null;
    joueur = null;
    surligne = null;
    document.getElementById("q").value = "";
    ecrireAdresse();
    rendre();
  });
}

// Sur un écran étroit, la barre recouvre la page : elle s'ouvre à la demande,
// pas d'emblée. Sur un grand écran elle fait partie du meuble.
if (window.matchMedia("(max-width: 900px)").matches) document.body.classList.add("replie");

charger();
</script>
