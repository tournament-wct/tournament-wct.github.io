<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promotions</title>
<!--
  Le tableau des promotions du forum Stake.

  Servi par le hub sur http://127.0.0.1:4610/site, lu depuis le disque à
  chaque requête : un rafraîchissement du navigateur suffit à voir une
  retouche, sans reconstruire quoi que ce soit.

  Publié sur GitHub Pages avec ses données cuites dans le repère plus bas.
  Servie par le hub, la page trouve ce repère à `null` et interroge
  /promotions elle-même — c'est la même page des deux côtés.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── Les couleurs ────────────────────────────────────────────────────────
   La page se lit en deux matières. Le **tableau** — sombre, toujours, dans
   les deux thèmes — porte ce qui se mesure : la cagnotte, l'horloge, les
   relevés. La **page** — claire ou sombre selon le lecteur — porte ce qui se
   lit et se juge : les règles, les réserves, le classement.

   Ce n'est pas une coquetterie. Ce site n'est pas un classement officiel,
   c'est un instrument qui lit un signal imparfait et qui le dit. Séparer le
   relevé du commentaire, c'est séparer ce que la machine mesure de ce qu'il
   faut encore interpréter.

   Trois thèmes pour deux palettes : clair, sombre, et « comme le système ».
   Le choix du lecteur l'emporte toujours — `data-theme` sur <html> — et la
   requête média ne décide que lorsqu'il n'a rien choisi. */
:root {
  --papier:   #eeeeea;
  --carte:    #ffffff;
  --creux:    #f6f6f3;
  --encre:    #15171b;
  --douce:    #5d6470;
  --filet:    #d2d3cc;
  --filet-fin:#e4e5df;
  --cobalt:   #2b3fa0;
  --ambre:    #8a6512;
  --ambre-fond: rgba(186, 142, 32, .14);
  --vert:     #0f7a54;
  --rouge:    #b8342a;
  --ombre:    0 1px 2px rgba(21, 23, 27, .05);
  --ombre-h:  0 18px 40px -22px rgba(21, 23, 27, .45);
  --tableau:  #14171c;
  --barre-l:  300px;
  /* Une seule mesure pour toute la colonne. Elle était dispersée : le
     tableau sombre et le classement s'arrêtaient à 1100 px pendant que le
     podium, les règles et les titres de section couraient jusqu'au bord.
     Rien ne s'alignait, ni entre les pages ni à l'intérieur d'une page. */
  --large-contenu: 1280px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="clair"]) {
    --papier:   #0e1013;
    --carte:    #171a1f;
    --creux:    #1c2026;
    --encre:    #e9ebe8;
    --douce:    #99a1ac;
    --filet:    #2c323a;
    --filet-fin:#22272d;
    --cobalt:   #8ea6ff;
    --ambre:    #e0b458;
    --ambre-fond: rgba(224, 180, 88, .11);
    --vert:     #4fd3a3;
    --rouge:    #f08877;
    --ombre:    0 1px 2px rgba(0, 0, 0, .4);
    --ombre-h:  0 18px 40px -22px rgba(0, 0, 0, .8);
    --tableau:  #1c2128;
  }
}
:root[data-theme="sombre"] {
  --papier:   #0e1013;
  --carte:    #171a1f;
  --creux:    #1c2026;
  --encre:    #e9ebe8;
  --douce:    #99a1ac;
  --filet:    #2c323a;
  --filet-fin:#22272d;
  --cobalt:   #8ea6ff;
  --ambre:    #e0b458;
  --ambre-fond: rgba(224, 180, 88, .11);
  --vert:     #4fd3a3;
  --rouge:    #f08877;
  --ombre:    0 1px 2px rgba(0, 0, 0, .4);
  --ombre-h:  0 18px 40px -22px rgba(0, 0, 0, .8);
  --tableau:  #1c2128;
}

/* Les couleurs du tableau ne changent jamais : il est sombre des deux
   côtés, c'est ce qui en fait un objet et non un fond. */
:root {
  --t-encre: #f4f5f2;
  --t-douce: #98a2ad;
  --t-filet: rgba(255, 255, 255, .13);
  --t-vert:  #5bd6a6;
  --t-rouge: #ff8f78;
  --t-ambre: #ecc163;
  --t-bleu:  #93a9ff;
}

/* ── La typographie ──────────────────────────────────────────────────────
   Une seule famille de titrage, Archivo, prise sur son axe de largeur. Les
   titres et les sommes sont **étendus**, les étiquettes **étroites** : le
   contraste large/étroit tient lieu de signature et ne coûte qu'un fichier.
   Le texte courant reste en Plex Sans, qui se lit mieux en petit corps, et
   tous les chiffres en Plex Mono à chasse fixe — une colonne de montants
   doit s'aligner. */
.large {
  font-family: Archivo, "Archivo Narrow", sans-serif;
  font-variation-settings: "wdth" 112;
  letter-spacing: -.015em;
}
.etroit {
  font-family: Archivo, "Archivo Narrow", sans-serif;
  font-variation-settings: "wdth" 76;
  letter-spacing: .13em; text-transform: uppercase;
}

* { box-sizing: border-box; }
/* `min-height` et non `height` : un élément collant ne colle que dans la
   boîte de son parent, et `height: 100%` bornait celle du <body> à un écran.
   Passé le premier défilement, l'en-tête cessait donc de coller et s'en
   allait — pendant que la barre latérale, dont le parent grandit avec le
   contenu, restait accrochée à 58 px sous un en-tête absent. */
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--papier);
  color: var(--encre);
  font: 15px/1.58 "IBM Plex Sans", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
h1, h2, h3 { font-family: Archivo, "Archivo Narrow", sans-serif; }
.mono, .num { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
a { color: var(--cobalt); }

/* Toutes les étiquettes du site, d'un seul tenant. */
/* `th.num` explicitement : sinon `.num` — qui donne la chasse fixe aux
   chiffres — l'emporte sur `th` et met « RANG » en Plex Mono. Le mono est
   pour les nombres, pas pour les intitulés de colonne. */
.etiquette, th, th.num, .fil, .onglet, .tri button, .groupe-titre, h3.section, .podium .rang, .bande td {
  font-family: Archivo, "Archivo Narrow", sans-serif;
  font-variation-settings: "wdth" 76;
  text-transform: uppercase; letter-spacing: .13em; font-weight: 600;
}

/* ── L'en-tête ─────────────────────────────────────────────────────────── */
.tete {
  display: flex; align-items: center; gap: 14px;
  padding: 0 18px; height: 58px;
  background: var(--carte);
  border-bottom: 1px solid var(--filet);
  position: sticky; top: 0; z-index: 30;
}
.tete h1 {
  margin: 0; font-size: 17px; font-weight: 700;
  font-variation-settings: "wdth" 118; letter-spacing: .1em;
  text-transform: uppercase; white-space: nowrap;
}
.grandit { flex: 1; }

button, input {
  font: inherit; color: inherit; background: transparent;
  border: 1px solid var(--filet); padding: 6px 11px; border-radius: 7px;
  transition: background .15s, border-color .15s, color .15s;
}
button { cursor: pointer; }
button:hover { border-color: var(--douce); background: var(--creux); }
:focus-visible { outline: 2px solid var(--cobalt); outline-offset: 2px; border-radius: 4px; }

/* Les onglets : un seul contenant, une pastille pleine pour l'actif. */
.onglets {
  display: flex; gap: 2px; padding: 3px;
  background: var(--creux); border: 1px solid var(--filet); border-radius: 9px;
}
.onglet {
  border: 0; border-radius: 6px; font-size: 11px;
  padding: 5px 12px; color: var(--douce); background: transparent;
}
.onglet:hover { background: transparent; color: var(--encre); }
.onglet[aria-pressed="true"] {
  background: var(--encre); color: var(--carte); box-shadow: var(--ombre);
}
.icone { width: 36px; padding: 6px 0; text-align: center; font-size: 15px; }
/* Le sélecteur de langue porte deux lettres, pas un pictogramme : il doit se
   lire d'un coup d'œil et dire vers quoi il emmène, pas où l'on est. */
#langue {
  width: auto; min-width: 38px; padding: 6px 9px;
  font: 600 12px "IBM Plex Mono", monospace; letter-spacing: .04em;
}

/* La recherche : la porte d'entrée de qui vient voir son propre nom. */
.chercher { position: relative; }
.chercher input { width: 244px; padding-left: 31px; background: var(--creux); border-radius: 9px; }
.chercher input:focus { background: var(--carte); }
.chercher::before {
  content: "⌕"; position: absolute; left: 10px; top: 50%;
  transform: translateY(-52%); color: var(--douce); font-size: 17px; pointer-events: none;
}
.raccourci {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  font: 11px "IBM Plex Mono", monospace; color: var(--douce);
  border: 1px solid var(--filet); border-radius: 4px; padding: 0 5px; pointer-events: none;
}
.chercher input:focus ~ .raccourci, .chercher input:not(:placeholder-shown) ~ .raccourci { display: none; }

/* ── Le corps ──────────────────────────────────────────────────────────── */
.corps { display: flex; align-items: stretch; min-height: calc(100vh - 58px); }

aside {
  width: var(--barre-l); flex: none;
  background: var(--carte); border-right: 1px solid var(--filet);
  overflow-y: auto; max-height: calc(100vh - 58px);
  position: sticky; top: 58px;
  scrollbar-width: thin;
}
body.replie aside { display: none; }
/* ── Les familles ──────────────────────────────────────────────────────
   Le premier choix de la barre, avant même de filtrer ou de trier : on
   vient rarement voir « les promotions », on vient voir les machines à
   sous, les Originals ou le sport. Deux par deux plutôt qu'en ligne — en
   trois cents pixels, « Machine à sous » ne tient pas à côté du reste. */
.familles {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
  padding: 12px 13px 4px;
}
.familles button {
  display: flex; align-items: baseline; gap: 6px;
  padding: 7px 10px; border-radius: 9px; font-size: 12.5px;
  background: var(--creux); text-align: left;
}
.familles button:hover { background: var(--carte); border-color: var(--douce); }
.familles button .compte {
  margin-left: auto; font: 11px "IBM Plex Mono", monospace; color: var(--douce);
}
.familles button[aria-pressed="true"] {
  background: var(--encre); color: var(--carte); border-color: var(--encre);
}
.familles button[aria-pressed="true"] .compte { color: var(--carte); opacity: .7; }
.familles button:disabled { opacity: .45; cursor: default; }
.familles button:disabled:hover { background: var(--creux); border-color: var(--filet); }

.filtre-barre { padding: 11px 13px 9px; }
.filtre-barre input { width: 100%; background: var(--creux); border-radius: 8px; }

/* ── Le tri ────────────────────────────────────────────────────────────
   Trois façons de lire la même liste. Par échéance elle se groupe d'elle-
   même — ce qui ferme aujourd'hui n'est pas ce qui ferme la semaine
   prochaine ; par cagnotte ou par affluence il n'y a pas de palier naturel,
   donc pas de groupes, juste un ordre. */
.tri {
  display: flex; gap: 2px; margin: 0 13px 12px; padding: 3px;
  background: var(--creux); border: 1px solid var(--filet); border-radius: 9px;
}
.tri button {
  flex: 1; border: 0; border-radius: 6px; padding: 5px 4px;
  font-size: 10px; color: var(--douce); background: transparent;
}
.tri button:hover { background: transparent; color: var(--encre); }
.tri button[aria-pressed="true"] { background: var(--encre); color: var(--carte); box-shadow: var(--ombre); }

.groupe-titre {
  padding: 9px 14px 8px; font-size: 10px; color: var(--douce);
  background: var(--carte);
  border-top: 1px solid var(--filet); border-bottom: 1px solid var(--filet-fin);
  display: flex; align-items: center; gap: 8px; position: sticky; top: 0; z-index: 2;
}
.groupe-titre .compte {
  margin-left: auto; font-family: "IBM Plex Mono", monospace;
  letter-spacing: 0; font-size: 11px;
  background: var(--creux); border-radius: 999px; padding: 1px 7px;
}
.groupe-titre.chaud { color: var(--rouge); }
.groupe-titre.chaud .compte { background: var(--rouge); color: var(--carte); }

/* ── Une entrée ────────────────────────────────────────────────────────
   La pastille dit d'un coup d'œil ce que la promotion vaut comme lecture :
   pleine, un classement est calculé ; cerclée d'ambre, elle tire au sort ;
   creuse, ses règles ne se lisent pas. C'est la question qu'on se pose
   avant d'ouvrir. */
.entree {
  display: block; width: 100%; text-align: left;
  color: inherit; text-decoration: none; cursor: pointer;
  border: 0; border-bottom: 1px solid var(--filet-fin);
  padding: 11px 14px 12px 26px; border-radius: 0; background: transparent;
  position: relative;
}
.entree::before {
  content: ""; position: absolute; left: 12px; top: 16px;
  width: 7px; height: 7px; border-radius: 999px;
  border: 1.5px solid var(--filet); background: transparent;
}
.entree.classe::before { background: var(--cobalt); border-color: var(--cobalt); }
.entree.hasard::before { border-color: var(--ambre); }
.entree:hover { background: var(--creux); }
.entree[aria-current="true"] { background: var(--ambre-fond); }
.entree[aria-current="true"]::after {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  background: var(--cobalt);
}
.entree .haut-e { display: flex; gap: 8px; align-items: flex-start; }
.entree .nom {
  font-weight: 600; font-size: 13.5px; line-height: 1.34; flex: 1;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.entree .quand {
  flex: none; font: 11px "IBM Plex Mono", monospace; color: var(--douce);
  background: var(--creux); border-radius: 999px; padding: 2px 8px; white-space: nowrap;
}
.entree .quand.urgent { color: var(--carte); background: var(--rouge); font-weight: 600; }
/* Une seule ligne, quoi qu'il arrive : « Exclusive VIP Promotions &
   Challenges » repassait à la ligne et faisait grandir l'entrée d'un tiers,
   ce qui rendait la liste deux fois plus longue à parcourir. La section est
   ce qu'on regarde en dernier — c'est elle qu'on tronque. */
.entree .meta {
  display: flex; gap: 9px; margin-top: 5px; align-items: baseline;
  font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--douce);
}
.entree .pot { color: var(--vert); font-weight: 600; font-size: 12.5px; flex: none; }
.entree .meta > span:nth-child(2) { flex: none; }
.entree .ou {
  font-family: "IBM Plex Sans", sans-serif;
  flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

main { flex: 1; min-width: 0; padding: 22px 26px 90px; }
#vue > * { max-width: var(--large-contenu); }

/* ── Le résumé, en tête de barre ─────────────────────────────────────── */
.resume { padding: 15px 14px 13px; border-bottom: 1px solid var(--filet); }
.resume .grand {
  font-family: Archivo, sans-serif; font-variation-settings: "wdth" 112;
  font-size: 32px; font-weight: 700; color: var(--vert);
  line-height: 1; letter-spacing: -.025em;
  font-variant-numeric: tabular-nums;
}
.resume .sous { font-size: 12px; color: var(--douce); margin-top: 5px; }
.resume .presse { color: var(--rouge); font-weight: 600; }

/* Le bandeau de la vue joueur, qui lui reste en tête de colonne. */
.semaine {
  display: flex; flex-wrap: wrap;
  background: var(--carte); border: 1px solid var(--filet);
  border-radius: 12px; box-shadow: var(--ombre);
  margin-bottom: 18px; overflow: hidden;
}
.semaine .bloc { padding: 13px 22px; border-right: 1px solid var(--filet-fin); flex: none; }
.semaine .bloc:last-child { border-right: 0; }
.semaine .etiquette { display: block; font-size: 10px; color: var(--douce); }
.semaine .valeur {
  font-family: "IBM Plex Mono", monospace; font-size: 21px; font-weight: 500;
  font-variant-numeric: tabular-nums; margin-top: 2px;
}
.semaine .valeur.argent { color: var(--vert); }
.semaine .valeur.presse { color: var(--rouge); }

/* ── Le tableau d'une promotion ────────────────────────────────────────
   Le seul objet sombre de la page, et son point focal. Il porte ce qui se
   relève : le nom, la cagnotte, l'horloge, les compteurs. Tout ce qui
   s'interprète — règles, réserves, classement — retombe sur la page claire
   juste en dessous. */
.entete {
  background:
    radial-gradient(120% 150% at 86% -30%, rgba(147, 169, 255, .14) 0%, transparent 58%),
    var(--tableau);
  color: var(--t-encre);
  border-radius: 14px; padding: 22px 24px 0; margin-bottom: 20px;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .07), var(--ombre-h);
}
.entete .haut { display: flex; gap: 28px; align-items: flex-start; flex-wrap: wrap; }
.entete .titraille { flex: 1; min-width: 260px; }
.fil { font-size: 10px; color: var(--t-douce); }
.entete h2 {
  margin: 7px 0 8px; font-size: 33px; line-height: 1.1; font-weight: 700;
  font-variation-settings: "wdth" 112; letter-spacing: -.02em;
}
.entete .critere { font-size: 13.5px; color: var(--t-douce); }
.entete .critere b { color: var(--t-encre); font-weight: 600; }
.entete a { color: var(--t-bleu); }
.source { font-size: 12.5px; text-decoration: none; border-bottom: 1px solid currentColor; }

/* Le lien de la promotion. Il vit sur le tableau plutôt que dans un menu :
   une adresse qu'on ne voit pas est une adresse qu'on ne partage pas. */
.lien-promo {
  font: 11px "IBM Plex Mono", monospace; padding: 2px 9px; border-radius: 999px;
  color: var(--t-douce); border-color: var(--t-filet);
}
.lien-promo:hover { color: var(--t-encre); background: rgba(255,255,255,.07); border-color: var(--t-filet); }
.lien-promo.fait { color: var(--t-vert); border-color: var(--t-vert); }

.pot { text-align: right; flex: none; }
.pot .somme {
  font-family: Archivo, sans-serif; font-variation-settings: "wdth" 112;
  font-size: 52px; font-weight: 700; color: var(--t-vert);
  line-height: .95; letter-spacing: -.035em; display: block;
  font-variant-numeric: tabular-nums;
}
.pot .etiquette { font-size: 10px; color: var(--t-douce); }

/* ── La règle graduée ──────────────────────────────────────────────────
   Le compte à rebours, mesuré. « 3 h » ne dit pas si la promotion a ouvert
   hier ou il y a six jours, ni s'il reste un dixième ou la moitié du temps.
   Un cran par jour, la portion écoulée encrée, un curseur sur maintenant :
   on lit la course entière d'un coup d'œil. */
.chrono { margin: 22px 0 0; }
.chrono .axe {
  position: relative; height: 26px;
  border-bottom: 1px solid var(--t-filet);
}
.chrono .ecoule {
  position: absolute; left: 0; bottom: -1px; height: 3px;
  background: var(--t-bleu); border-radius: 2px 0 0 2px;
  animation: pousse .7s cubic-bezier(.2, .75, .25, 1) both;
}
.chrono.presse .ecoule { background: var(--t-rouge); }
.chrono .cran {
  position: absolute; bottom: 0; width: 1px; height: 6px;
  background: var(--t-filet);
}
.chrono .cran.fort { height: 11px; background: rgba(255, 255, 255, .28); }
.chrono .curseur { position: absolute; bottom: -1px; transform: translateX(-50%); }
.chrono .curseur i {
  display: block; width: 1px; height: 22px; margin: 0 auto;
  background: var(--t-encre);
}
.chrono .curseur span {
  position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
  font: 600 11px "IBM Plex Mono", monospace; white-space: nowrap;
  background: var(--t-encre); color: var(--tableau);
  border-radius: 999px; padding: 1px 8px;
}
/* Centrée sur le curseur, la pastille sort du tableau aux deux extrémités —
   et une promotion qu'on regarde est presque toujours près de sa fin. Aux
   bords, elle s'aligne au lieu de se centrer. */
.chrono .curseur.au-bout span { left: auto; right: 0; transform: none; }
.chrono .curseur.au-debut span { left: 0; transform: none; }
.chrono.presse .curseur i { background: var(--t-rouge); }
.chrono.presse .curseur span { background: var(--t-rouge); color: #fff; }
.chrono .bornes {
  display: flex; justify-content: space-between; margin-top: 7px;
  font: 11px "IBM Plex Mono", monospace; color: var(--t-douce);
}
.chrono .bornes .fin { color: var(--t-encre); }
.chrono.presse .bornes .fin { color: var(--t-rouge); }
@keyframes pousse { from { width: 0 !important; } }

.stats {
  display: flex; flex-wrap: wrap; margin: 20px -24px 0; padding: 0 24px;
  border-top: 1px solid var(--t-filet); overflow-x: auto;
}
.stat { padding: 13px 26px 14px 0; margin-right: 26px; border-right: 1px solid var(--t-filet); flex: none; }
.stat:last-child { border-right: 0; }
.stat .etiquette { display: block; font-size: 10px; color: var(--t-douce); }
.stat .valeur {
  font-family: "IBM Plex Mono", monospace; font-size: 20px; font-weight: 500;
  font-variant-numeric: tabular-nums; margin-top: 3px;
}
.stat .valeur.argent { color: var(--t-vert); }
.stat .valeur.mot {
  font-family: "IBM Plex Sans", sans-serif; font-size: 14px;
  font-weight: 500; line-height: 1.45; max-width: 24ch;
}

/* ── Mon pseudo ────────────────────────────────────────────────────────
   Ce n'est pas une connexion et ça ne doit pas en avoir l'air : il n'y a ni
   mot de passe, ni vérification, et n'importe qui peut taper n'importe quel
   nom. Le bouton dit donc « Mon pseudo », et le dialogue le répète. */
.moi-bouton {
  display: flex; align-items: center; gap: 7px; max-width: 190px;
  border-radius: 9px; padding: 6px 11px;
}
.moi-bouton .nom {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600;
}
.moi-bouton .pastille {
  flex: none; width: 20px; height: 20px; border-radius: 999px;
  background: var(--cobalt); color: var(--carte);
  font: 600 10px/20px "IBM Plex Mono", monospace; text-align: center;
  text-transform: uppercase;
}

/* ── Le menu du pseudo ─────────────────────────────────────────────────
   Ce qu'il reste à faire, en un clic depuis n'importe quelle page. Le
   tableau complet existe toujours derrière, mais on ne veut pas quitter ce
   qu'on regarde pour savoir s'il reste une promotion à remplir. */
.moi-zone { position: relative; }
.moi-menu {
  position: absolute; top: calc(100% + 7px); right: 0; z-index: 45;
  width: min(360px, calc(100vw - 20px));
  background: var(--carte); border: 1px solid var(--filet); border-radius: 12px;
  box-shadow: var(--ombre-h); max-height: min(70vh, 560px); overflow-y: auto;
}
.moi-menu[hidden] { display: none; }
.moi-menu .tete-menu {
  padding: 12px 14px 11px; border-bottom: 1px solid var(--filet);
  position: sticky; top: 0; background: var(--carte); z-index: 2;
}
.moi-menu .tete-menu .qui {
  font-family: Archivo, sans-serif; font-variation-settings: "wdth" 112;
  font-size: 17px; font-weight: 700; letter-spacing: -.015em;
}
.moi-menu .tete-menu .combien { font-size: 12.5px; color: var(--douce); margin-top: 2px; }
.moi-menu .tete-menu .combien b { color: var(--rouge); font-weight: 600; }
.moi-menu .groupe-menu {
  padding: 8px 14px 6px; font-size: 9.5px; color: var(--douce);
  font-family: Archivo, sans-serif; font-variation-settings: "wdth" 76;
  text-transform: uppercase; letter-spacing: .13em; font-weight: 600;
  border-top: 1px solid var(--filet-fin);
}
.moi-menu .ligne {
  display: block; text-decoration: none; color: inherit;
  padding: 10px 14px 11px; border-top: 1px solid var(--filet-fin);
}
.moi-menu .ligne:first-of-type { border-top: 0; }
.moi-menu .ligne:hover { background: var(--creux); }
.moi-menu .ligne .haut-l { display: flex; gap: 8px; align-items: baseline; }
.moi-menu .ligne .nom-l {
  flex: 1; font-weight: 600; font-size: 13.5px; line-height: 1.32;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.moi-menu .ligne .quand {
  flex: none; font: 11px "IBM Plex Mono", monospace; color: var(--douce);
  background: var(--creux); border-radius: 999px; padding: 2px 8px; white-space: nowrap;
}
.moi-menu .ligne:hover .quand { background: var(--carte); }
.moi-menu .ligne .quand.urgent { color: var(--carte); background: var(--rouge); font-weight: 600; }
/* Quatre lignes, une question par ligne : ce qu'il y a en jeu et combien
   sont déjà dedans, comment on gagne et ce que ça rapporte, ce qu'il faut
   respecter. Une seule ligne mélangée ne se lisait pas. */
.moi-menu .ligne .detail {
  display: flex; gap: 8px; margin-top: 5px; align-items: baseline; flex-wrap: wrap;
  font: 11.5px "IBM Plex Mono", monospace; color: var(--douce);
}
.moi-menu .ligne .detail .pot { color: var(--vert); font-weight: 600; font-size: 12.5px; }
.moi-menu .ligne .comment {
  margin-top: 3px; font-size: 12px; line-height: 1.4; color: var(--encre);
}
.moi-menu .ligne .comment b { font-weight: 600; }
.moi-menu .ligne .comment .paie { color: var(--vert); font-weight: 600; }
.moi-menu .ligne .comment .flou { color: var(--ambre); }
/* Sur quoi jouer : la ligne la plus actionnable de la fiche, et celle qui
   manquait. « 4 machines imposées » donnait le compte sans les noms. */
.moi-menu .ligne .machines {
  margin-top: 6px; padding: 5px 8px; border-radius: 7px;
  background: var(--creux); font-size: 12px; line-height: 1.4;
}
.moi-menu .ligne:hover .machines { background: var(--carte); }
/* L'observation se distingue de la règle : bordure pointillée, étiquette en
   ambre. Le lecteur doit voir que c'est constaté, pas exigé. */
.moi-menu .ligne .machines.vues {
  background: transparent; border: 1px dashed var(--filet);
}
.moi-menu .ligne:hover .machines.vues { background: transparent; }
.moi-menu .ligne .machines.vues .eti { color: var(--ambre); }
.moi-menu .ligne .machines .eti {
  font-family: Archivo, sans-serif; font-variation-settings: "wdth" 76;
  text-transform: uppercase; letter-spacing: .12em; font-weight: 600;
  font-size: 9.5px; color: var(--douce); margin-right: 7px;
}
.moi-menu .ligne .exig {
  margin-top: 5px; font: 11px "IBM Plex Mono", monospace; color: var(--douce);
  line-height: 1.45;
}
.moi-menu .ligne .repondre {
  display: block; margin-top: 6px; font-size: 11.5px; color: var(--cobalt); font-weight: 600;
}
.moi-menu .rien-menu { padding: 18px 14px; color: var(--douce); font-size: 13.5px; margin: 0; }
.moi-menu .pied {
  display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--filet);
  position: sticky; bottom: 0; background: var(--carte);
}
.moi-menu .pied button, .moi-menu .pied a {
  flex: 1; text-align: center; font-size: 12px; padding: 6px 8px; border-radius: 8px;
  text-decoration: none; color: inherit; border: 1px solid var(--filet); cursor: pointer;
}
.moi-menu .pied a:hover, .moi-menu .pied button:hover { border-color: var(--encre); background: var(--creux); }

dialog {
  border: 1px solid var(--filet); border-radius: 14px; padding: 0;
  background: var(--carte); color: var(--encre);
  box-shadow: var(--ombre-h); width: min(400px, calc(100vw - 32px));
}
dialog::backdrop { background: rgba(0, 0, 0, .45); }
dialog .dedans { padding: 20px 22px 18px; }
dialog h2 {
  margin: 0 0 4px; font-size: 21px; font-weight: 700;
  font-variation-settings: "wdth" 112; letter-spacing: -.015em;
}
dialog p { margin: 0 0 14px; font-size: 13px; color: var(--douce); }
dialog input { width: 100%; background: var(--creux); border-radius: 9px; }
dialog .boutons { display: flex; gap: 8px; margin-top: 16px; }
dialog .boutons .grandir { flex: 1; }
dialog .principal { background: var(--encre); color: var(--carte); border-color: var(--encre); font-weight: 600; }
dialog .principal:hover { background: var(--encre); color: var(--carte); opacity: .88; }
dialog .oublier { color: var(--rouge); border-color: var(--filet); }

/* Les propositions du dialogue : mêmes règles que la barre de recherche,
   mais dans le flux plutôt qu'en surcouche — un menu flottant dans une
   fenêtre modale se fait rogner par la fenêtre. */
.propositions { margin-top: 9px; max-height: 210px; overflow-y: auto; }
.propositions button {
  display: flex; width: 100%; text-align: left; border: 0; border-radius: 7px;
  padding: 7px 10px; gap: 8px; align-items: baseline;
}
.propositions button:hover, .propositions button[aria-selected="true"] { background: var(--ambre-fond); }
.propositions .compte { margin-left: auto; font: 11.5px "IBM Plex Mono", monospace; color: var(--douce); }
.propositions .rien { font-size: 13px; color: var(--douce); padding: 8px 10px; margin: 0; }

/* ── Ce qui te manque ──────────────────────────────────────────────────
   L'inverse du classement : non pas où tu en es, mais où tu n'es pas.
   C'est la vue qui manquait — sur 779 joueurs en cours, 451 n'ont joué
   qu'une promotion sur dix-neuf. */
.manque { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 13px; }
.manque .cas {
  background: var(--carte); border: 1px solid var(--filet); border-radius: 12px;
  padding: 14px 16px 15px; box-shadow: var(--ombre);
}
.manque .cas.reste { border-left: 3px solid var(--ambre); }
.manque .haut-m {
  display: flex; align-items: baseline; gap: 9px; font-size: 10.5px; color: var(--douce);
  font-family: Archivo, sans-serif; font-variation-settings: "wdth" 76;
  text-transform: uppercase; letter-spacing: .13em; font-weight: 600;
}
.manque .haut-m .quand {
  margin-left: auto; flex: none; font: 11px "IBM Plex Mono", monospace;
  letter-spacing: 0; text-transform: none;
}
.manque .haut-m .quand.urgent { color: var(--rouge); font-weight: 600; }
.manque .nom-m { font-weight: 600; font-size: 15.5px; line-height: 1.3; margin: 7px 0 4px; }
.manque .nom-m a { color: inherit; text-decoration: none; }
.manque .nom-m a:hover { color: var(--cobalt); }
.manque .gain {
  font-family: Archivo, sans-serif; font-variation-settings: "wdth" 112;
  font-size: 20px; font-weight: 700; color: var(--vert); letter-spacing: -.02em;
}
.manque .encore { font-size: 12.5px; color: var(--ambre); font-weight: 600; }
.manque .regles { margin: 10px 0 0; gap: 6px; }
.manque .puce { font-size: 11.5px; padding: 3px 9px; }
.manque .agir { margin-top: 13px; }
.manque .agir .aller {
  display: inline-block; font-size: 12.5px; font-weight: 600; padding: 7px 14px;
  border-radius: 8px; text-decoration: none; color: inherit;
  border: 1px solid var(--filet); background: var(--creux);
}
.manque .agir .aller:hover { border-color: var(--encre); background: var(--carte); }

/* ── L'accueil ─────────────────────────────────────────────────────────
   On n'arrive plus sur une promotion prise au hasard. Le tableau annonce ce
   que pèse la semaine, trois portes mènent aux familles, et deux rangées de
   cartes disent ce qui ferme et ce qui paie le plus. */
.entete.accueil { padding-bottom: 22px; }
.entete.accueil h2 { font-size: 22px; margin: 6px 0 0; }
.entete.accueil .pot .somme { font-size: 60px; }

.portes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 13px; margin: 0 0 4px; }
.porte {
  display: block; text-decoration: none; color: inherit;
  background: var(--carte); border: 1px solid var(--filet); border-radius: 12px;
  padding: 15px 17px 16px; box-shadow: var(--ombre);
  transition: border-color .15s, transform .15s, box-shadow .15s;
}
.porte:hover { border-color: var(--encre); transform: translateY(-2px); box-shadow: var(--ombre-h); }
.porte .nom {
  font-size: 10.5px; color: var(--douce);
  display: flex; align-items: center; gap: 8px;
}
.porte .nom .fleche { margin-left: auto; font-size: 14px; letter-spacing: 0; }
.porte .combien {
  font-family: Archivo, sans-serif; font-variation-settings: "wdth" 112;
  font-size: 30px; font-weight: 700; letter-spacing: -.025em; line-height: 1.1; margin-top: 6px;
}
.porte .sous { font-family: "IBM Plex Mono", monospace; font-size: 12.5px; color: var(--vert); font-weight: 600; }

.cartes { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: 13px; }
.carte-p {
  display: block; text-decoration: none; color: inherit;
  background: var(--carte); border: 1px solid var(--filet); border-radius: 12px;
  padding: 13px 15px 14px; box-shadow: var(--ombre);
  transition: border-color .15s, transform .15s, box-shadow .15s;
}
.carte-p:hover { border-color: var(--encre); transform: translateY(-2px); box-shadow: var(--ombre-h); }
.carte-p .haut-c {
  display: flex; align-items: baseline; gap: 8px;
  font-size: 10.5px; color: var(--douce);
  font-family: Archivo, sans-serif; font-variation-settings: "wdth" 76;
  text-transform: uppercase; letter-spacing: .13em; font-weight: 600;
}
.carte-p .haut-c .ou { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.carte-p .haut-c .quand {
  margin-left: auto; flex: none; font: 11px "IBM Plex Mono", monospace;
  letter-spacing: 0; text-transform: none; color: var(--douce);
}
.carte-p .haut-c .quand.urgent { color: var(--rouge); font-weight: 600; }
.carte-p .nom {
  font-weight: 600; font-size: 15px; line-height: 1.3; margin: 6px 0 9px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  min-height: 2.6em;
}
.carte-p .chiffres {
  display: flex; align-items: baseline; gap: 10px;
  font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--douce);
}
.carte-p .chiffres .somme {
  font-family: Archivo, sans-serif; font-variation-settings: "wdth" 112;
  font-size: 22px; font-weight: 700; color: var(--vert); letter-spacing: -.02em;
}
.carte-p .mini { height: 3px; background: var(--filet-fin); border-radius: 2px; margin-top: 11px; }
.carte-p .mini i { display: block; height: 100%; background: var(--cobalt); border-radius: 2px; }
.carte-p .mini.presse i { background: var(--rouge); }

/* Le titre ramène à l'accueil : c'est le geste qu'on essaie d'abord. */
.tete h1 a { color: inherit; text-decoration: none; }

@media (max-width: 760px) {
  .portes { grid-template-columns: 1fr; }
  .entete.accueil .pot .somme { font-size: 42px; }
}

/* ── Le podium ─────────────────────────────────────────────────────────
   Trois places, parce que c'est ainsi qu'on lit un résultat : d'abord qui
   gagne, ensuite le tableau. Le reste de la page ne le disait qu'en petits
   caractères, à la dix-septième ligne. */
.podium { display: flex; gap: 13px; margin: 0 0 4px; flex-wrap: wrap; }
.podium .place {
  flex: 1 1 190px; background: var(--carte); border: 1px solid var(--filet);
  border-radius: 12px; padding: 14px 16px 15px; box-shadow: var(--ombre);
  position: relative; overflow: hidden;
}
.podium .place::before {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--medaille);
}
.podium .place.or { --medaille: #c9a227; }
.podium .place.argent2 { --medaille: #9aa5b1; }
.podium .place.bronze { --medaille: #b07a43; }
.podium .rang {
  font-size: 10px; color: var(--douce);
  display: flex; align-items: baseline; gap: 8px;
}
.podium .rang > :first-child {
  font-family: Archivo, sans-serif; font-variation-settings: "wdth" 112;
  font-size: 19px; font-weight: 700; letter-spacing: -.01em;
  text-transform: none; color: var(--medaille);
}
.podium .qui { font-weight: 600; font-size: 17px; margin: 3px 0 3px; word-break: break-word; }
.podium .quoi { font-family: "IBM Plex Mono", monospace; font-size: 14px; color: var(--douce); }
.podium .gain {
  font-family: "IBM Plex Mono", monospace; color: var(--vert);
  font-weight: 600; margin-left: auto; font-size: 14px;
}

/* ── Les encarts ───────────────────────────────────────────────────────
   Repliés par défaut, sauf celui qui prévient. Trois pavés dépliés
   repoussaient le classement sous la ligne de flottaison ; un titre suffit à
   savoir s'il faut lire la suite. */
.avis {
  margin: 14px 0; padding: 0;
  background: var(--ambre-fond); border-left: 3px solid var(--ambre);
  border-radius: 3px 10px 10px 3px;
}
.avis > summary {
  list-style: none; cursor: pointer; padding: 11px 16px;
  font-family: Archivo, sans-serif; font-variation-settings: "wdth" 100;
  font-size: 14.5px; font-weight: 700;
  display: flex; align-items: baseline; gap: 9px;
}
.avis > summary::-webkit-details-marker { display: none; }
.avis > summary::after {
  content: "déplier"; margin-left: auto;
  font: 11px "IBM Plex Mono", monospace; color: var(--douce);
}
.avis[open] > summary::after { content: "replier"; }
/* `avis-corps` et non `corps` : la mise en page a déjà un `.corps`, qui porte
   `display:flex` et une hauteur minimale d'un écran. L'encart en héritait et
   mesurait sept cents pixels pour trois lignes de texte. */
.avis .avis-corps { padding: 0 16px 13px; }
.avis p { margin: 0 0 6px; font-size: 13.5px; color: var(--douce); }
.avis p:last-child { margin-bottom: 0; }
.avis .fort { color: var(--encre); font-weight: 600; }
/* Une réserve ne se replie pas : elle existe pour être lue avant le tableau. */
.avis.alerte { border-left-color: var(--rouge); background: rgba(184, 52, 42, .09); }
:root[data-theme="sombre"] .avis.alerte,
  :root:not([data-theme="clair"]) .avis.alerte { background: rgba(240, 136, 119, .10); }
.avis.alerte > summary::after { content: ""; }

.regles { display: flex; flex-wrap: wrap; gap: 7px; margin: 16px 0 2px; }
.puce {
  font-size: 12px; padding: 4px 11px; border: 1px solid var(--filet);
  border-radius: 999px; color: var(--douce); background: var(--carte);
}
.puce b { color: var(--encre); font-weight: 600; }

h3.section {
  margin: 30px 0 11px; font-size: 10.5px; color: var(--douce);
  border-bottom: 1px solid var(--filet); padding-bottom: 8px;
}

/* ── Les tableaux ──────────────────────────────────────────────────────── */

/* Huit colonnes ne tiennent pas dans un téléphone : le tableau y défile
   seul, sans emmener la page avec lui. Sur grand écran le conteneur ne
   défile pas — `overflow-x` non nul enferme aussi l'axe vertical, et
   l'en-tête collant du classement cesserait de coller. */
.defile { min-width: 0; }
table { width: 100%; border-collapse: collapse; }
th {
  text-align: left; font-size: 9.5px; color: var(--douce);
  padding: 0 11px 8px; border-bottom: 1px solid var(--filet);
  position: sticky; top: 58px; background: var(--papier); z-index: 5;
}
td { padding: 9px 11px; border-bottom: 1px solid var(--filet-fin); vertical-align: baseline; }
.num { text-align: right; }
tbody tr { transition: background .12s; }
tbody tr:hover { background: var(--carte); }
tbody tr.moi, tbody tr.moi:hover { background: var(--ambre-fond); box-shadow: inset 3px 0 0 var(--cobalt); }

.bande td {
  background: var(--creux);
  border-top: 1px solid var(--filet); border-bottom: 1px solid var(--filet);
  padding: 7px 11px; font-size: 10px; color: var(--douce);
}
.bande .dot {
  color: var(--vert); font-weight: 600; font-family: "IBM Plex Mono", monospace;
  letter-spacing: 0; text-transform: none;
}

.mesure { white-space: nowrap; }
.mesure .v { display: block; font-weight: 500; }
.mesure .trait { display: block; height: 2px; margin-top: 4px; background: var(--filet-fin); border-radius: 1px; }
.mesure .trait i { display: block; height: 100%; background: var(--cobalt); border-radius: 1px; }

.lien-nu { border: 0; padding: 0; background: none; font: inherit; color: inherit; cursor: pointer; text-align: left; }
.lien-nu:hover { color: var(--cobalt); background: none; }
.pseudo { font-weight: 500; }
/* Le pseudo du casino, quand il differe de celui du forum. Discret : c'est
   un rappel pour se reconnaitre dans les annonces de Stake, pas une
   deuxieme identite. */
.chez-stake {
  display: block; font: 11px "IBM Plex Mono", monospace; color: var(--douce);
  margin-top: 1px;
}
.chez-stake::before { content: "92 "; opacity: .6; }
.doux { color: var(--douce); }
.betid { font-size: 11.5px; color: var(--douce); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 22ch; font-family: "IBM Plex Mono", monospace; }
.machine { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 20ch; }
.argent { color: var(--vert); font-weight: 500; }
.etat-valide { color: var(--vert); }
.etat-peutetre { color: var(--ambre); }
.etat-refuse { color: var(--rouge); }
.etat-inconnu { color: var(--douce); }
.mouv { font-size: 11px; font-family: "IBM Plex Mono", monospace; }
.mouv.monte { color: var(--vert); }
.mouv.baisse { color: var(--rouge); }
.mouv.neuf { color: var(--cobalt); }

.plus { margin: 15px 0 0; border-radius: 8px; }
.vide { color: var(--douce); padding: 28px 0; }

/* ── La recherche et la vue joueur ─────────────────────────────────────── */
.suggestions {
  position: absolute; top: 100%; right: 0; margin-top: 6px; width: 292px;
  background: var(--carte); border: 1px solid var(--filet); border-radius: 11px;
  box-shadow: var(--ombre-h); z-index: 40; max-height: 60vh; overflow: hidden auto;
}
.suggestions button {
  display: flex; width: 100%; text-align: left; border: 0; border-radius: 0;
  border-bottom: 1px solid var(--filet-fin); padding: 9px 13px; gap: 8px; align-items: baseline;
}
.suggestions button:hover, .suggestions button[aria-selected="true"] { background: var(--ambre-fond); }
.suggestions .compte { margin-left: auto; font: 11.5px "IBM Plex Mono", monospace; color: var(--douce); }
.suggestions .rien { padding: 13px; color: var(--douce); font-size: 13.5px; margin: 0; }

.joueur-tete { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
.joueur-tete h2 {
  margin: 0; font-size: 30px; font-weight: 700;
  font-variation-settings: "wdth" 112; letter-spacing: -.02em;
}

/* ── L'arrivée ─────────────────────────────────────────────────────────
   La colonne se pose en cascade. C'est court, et ça donne l'ordre de
   lecture : le tableau, puis la réserve, puis le classement. */
@keyframes monte { from { opacity: 0; transform: translateY(9px); } }
#vue > * { animation: monte .34s cubic-bezier(.2, .7, .3, 1) both; }
#vue > :nth-child(2) { animation-delay: .04s; }
#vue > :nth-child(3) { animation-delay: .08s; }
#vue > :nth-child(4) { animation-delay: .12s; }
#vue > :nth-child(5) { animation-delay: .15s; }

@media (max-width: 900px) {
  aside { position: fixed; top: 58px; bottom: 0; left: 0; z-index: 25; box-shadow: 0 0 0 100vmax rgba(0,0,0,.45); }
  main { padding: 15px; }
  th { position: static; }
  .tete h1 { display: none; }
  .tete { gap: 8px; padding: 0 10px; }
  .onglet { padding: 5px 9px; }
  .chercher { flex: 1; min-width: 0; }
  .chercher input { width: 100%; }
  .raccourci { display: none; }
  .entete { padding: 16px 16px 0; border-radius: 12px; }
  .entete h2 { font-size: 23px; }
  .entete .haut { gap: 12px; }
  .pot { text-align: left; }
  .pot .somme { font-size: 38px; }
  /* Quatre relevés sur une ligne ne tiennent pas : ils débordaient sur deux
     rangs en gardant leurs filets verticaux, qui se retrouvaient à pendre
     dans le vide. Une grille de deux, sans filets, tient toute seule. */
  .stats {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px 0;
    margin: 16px -16px 0; padding: 14px 16px 16px; overflow: visible;
  }
  .stat { padding: 0; margin: 0; border-right: 0; }
  .suggestions { width: min(292px, calc(100vw - 20px)); }
  .defile { overflow-x: auto; -webkit-overflow-scrolling: touch; }
}

/* Sur un téléphone, les deux onglets et le champ ne tiennent pas sur une
   ligne : le champ se réduisait à sa loupe, et chercher un pseudo — la
   raison d'être de cette barre — devenait impossible. Il passe dessous, sur
   toute la largeur, et tout ce qui se cale sous l'en-tête suit. */
@media (max-width: 620px) {
  .tete { height: auto; flex-wrap: wrap; padding: 9px 10px; gap: 8px; }
  .grandit { display: none; }
  .chercher { flex: 1 0 100%; order: 3; }
  /* Tout doit tenir sur la première rangée, sinon le bouton de thème se
     retrouve seul sur la sienne : on rogne les marges et on tronque le
     pseudo plutôt que de passer à la ligne. */
  .moi-zone { order: 1; }
  .moi-bouton { max-width: 116px; padding: 5px 9px; gap: 6px; }
  /* Accroché à son bouton, le menu dépassait de l'écran par la gauche : il
     est large de 340 px et le bouton n'est pas au bord droit. Sur un
     téléphone il s'accroche donc à la fenêtre, et c'est le JS qui lui donne
     sa hauteur de départ — l'en-tête s'enroule sur deux rangées ou une
     selon la largeur, aucune constante ne tiendrait. */
  .moi-menu {
    position: fixed; left: 10px; right: 10px; width: auto;
    max-height: calc(100vh - 130px);
  }
  .icone { width: 32px; }
  #theme { order: 2; }
  aside { top: 102px; max-height: none; }
  .corps { min-height: calc(100vh - 102px); }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

function tr(clef, ...args) {
  const e = MOTS[clef];
  let v = e ? (e[langue] ?? e.fr) : clef;
  for (let i = 0; i < args.length; i += 1) v = v.split("{" + i + "}").join(args[i]);
  return v;
}

/** Le rang, dans la langue : 1ᵉʳ, 2ᵉ — 1st, 2nd, 3rd, 4th. */
function ordinal(n) {
  if (langue === "fr") return n + (n === 1 ? "ᵉʳ" : "ᵉ");
  const d = n % 10;
  const c = n % 100;
  if (d === 1 && c !== 11) return n + "st";
  if (d === 2 && c !== 12) return n + "nd";
  if (d === 3 && c !== 13) return n + "rd";
  return n + "th";
}

function poserLangue(nouvelle) {
  langue = LANGUES.includes(nouvelle) ? nouvelle : "fr";
  nf = new Intl.NumberFormat(codeLangue());
  try { localStorage.setItem("langue", langue); } catch (e) { /* tant pis */ }
  document.documentElement.lang = langue;
  rendreBoutonLangue();
  // Le balisage fixe de la page ne passe pas par le rendu : il porte ses
  // clefs en attributs, et se retraduit ici.
  for (const n of document.querySelectorAll("[data-i18n]")) n.textContent = tr(n.dataset.i18n);
  for (const n of document.querySelectorAll("[data-i18n-place]")) {
    n.placeholder = tr(n.dataset.i18nPlace);
    n.setAttribute("aria-label", tr(n.dataset.i18nPlace).replace("…", ""));
  }
  for (const n of document.querySelectorAll("[data-i18n-titre]")) {
    n.title = tr(n.dataset.i18nTitre);
    if (n.hasAttribute("aria-label")) n.setAttribute("aria-label", tr(n.dataset.i18nTitre));
  }
  // Tout le texte est produit au rendu : il suffit de tout redessiner.
  rendreBarre();
  if (monTableau) rendreMoi();
  else if (joueur) rendreJoueur(joueur);
  else if (choisie) rendreFiche(choisie);
  else rendreAccueil();
}

/** Le temps qui reste, dit simplement. */
function reste(iso) {
  if (!iso) return null;
  const ms = Date.parse(iso) - Date.now();
  if (!isFinite(ms)) return null;
  if (ms <= 0) return tr("finie");
  const h = Math.floor(ms / 3600000);
  // « 0 h » ne veut rien dire pour une promotion qui ferme dans le quart
  // d'heure — et c'est le moment où l'on regarde le plus.
  if (h < 1) return tr("duree_min", Math.max(1, Math.round(ms / 60000)));
  if (h < 48) return tr("duree_h", h);
  return tr("duree_j", Math.floor(h / 24));
}
const presse = (iso) => {
  const ms = Date.parse(iso || "") - Date.now();
  return isFinite(ms) && ms > 0 && ms < 6 * 3600000;
};

const heure = (iso) => {
  const d = new Date(iso);
  return isNaN(d) ? "—" : d.toLocaleString(codeLangue(), { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
};

function el(tag, attrs, ...enfants) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : String(v));
  }
  for (const e of enfants.flat()) {
    if (e === null || e === undefined || e === false) continue;
    n.append(e);
  }
  return n;
}

/** Sans accents ni casse : « Sébastien » se trouve en tapant « sebas ». */
const pliage = (s) => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

// Le pseudo que le lecteur dit être le sien. Ni compte ni vérification :
// juste de quoi lui montrer ce qui le concerne. Le rangement peut échouer
// — navigation privée, stockage bloqué — et ce n'est pas une raison pour

let moi = "";
try { moi = localStorage.getItem("pseudo") || ""; } catch (e) { /* tant pis */ }

const PAR_DEFAUT = 60;

// ── Les familles de jeu ──────────────────────────────────────────────────
//
// Trois familles, et une promotion peut tenir dans plusieurs : celle qui
// accepte n'importe quel jeu doit se trouver quelle que soit la famille
// qu'on a choisie.
//
// Deux signaux, tirés des données et non devinés. Le préfixe du Bet ID
// sépare le sport du casino — c'est Stake qui le pose, `sport:` contre
// `casino:`. Et les Originals reviennent de son API sous leur identifiant
// en minuscules d'un seul mot, ce que ne fait aucune machine à sous.
//
// Mesuré sur les 33 promotions connues : 17 des 19 qui se décident aux
// paris le font à 98 % ou plus. Les deux autres — Temporal Oblivion à
// 64/36, Bet ID Prediction à 45/27/27 — sont vraiment ouvertes. D'où le
// seuil : toute famille qui pèse au moins un sixième des paris compte.
const FAMILLES = [
  ["slots", "fam_slots"],
  ["original", "fam_original"],
  ["sports", "fam_sports"],
];
const ORIGINAUX = new Set([
  "blackjack", "crash", "diamonds", "dice", "hilo", "keno", "limbo", "mines",
  "plinko", "slide", "wheel", "baccarat", "roulette", "miniroulette",
  "videopoker", "cases", "dragontower", "pump", "snakes", "chicken",
  "towerlegends", "scarabspin", "tomeoflife", "diamondpoker",
]);
const JEUX_SPORT = new Set(["sportsbook", "swish"]);
const PART_MINIMALE = 1 / 6;

const clefJeu = (s) => (s || "").toLowerCase().replace(/[^a-z0-9]/g, "");

/**
 * Les familles d'une promotion, calculées une fois et retenues sur sa fiche.
 *
 * Ce que le fil annonce l'emporte sur ce qui s'y est joué : « Royal Club of
 * Originals | Blue Samurai » est une promotion d'Originals même si la
 * machine ne figure dans aucune liste — c'est l'organisateur qui décide de
 * ce qu'est sa promotion, pas nous.
 */
function famillesDe(f) {
  if (f._familles) return f._familles;
  const titre = (f.titre || "").toLowerCase();
  const section = (f.categorie || "").toLowerCase();
  let out = null;
  if (section.includes("sportsbook")) out = ["sports"];
  else if (/\bsports?\b|sportsbook|parlay|\bodds\b/.test(titre)) out = ["sports"];
  else if (titre.includes("original")) out = ["original"];
  else if (/\bslots?\b/.test(titre)) out = ["slots"];

  if (!out) {
    const compte = { slots: 0, original: 0, sports: 0 };
    let total = 0;
    for (const l of f.classement?.lignes || []) {
      const ids = l.bet_ids || [];
      const j = clefJeu(l.jeu);
      let quoi = null;
      if (ids.some((b) => b.startsWith("sport:")) || JEUX_SPORT.has(j)) quoi = "sports";
      else if (ORIGINAUX.has(j)) quoi = "original";
      else if (ids.length) quoi = "slots";
      if (quoi) { compte[quoi] += 1; total += 1; }
    }
    out = total
      ? FAMILLES.map(([c]) => c).filter((c) => compte[c] / total >= PART_MINIMALE)
      : [];
  }
  f._familles = out;
  return out;
}

const fiches = () => (jeux[filtre] || []).filter(
  (f) => !famille || famillesDe(f).includes(famille));
const toutesLesFiches = () => [...jeux.live, ...jeux.terminees];

// ── L'adresse ────────────────────────────────────────────────────────────
//
// Chaque promotion a la sienne, `#/p/257046`, et chaque joueur aussi,
// `#/j/RuslR`. Le fragment plutôt que le chemin : la page est un fichier
// unique, servi tel quel par le hub comme par GitHub Pages, et aucun des
// deux ne sait router `/promo/257046` vers elle.
//
// `derniereAdresse` est le garde-fou : écrire l'adresse déclenche
// `hashchange`, qui voudrait relire ce qu'on vient d'écrire. On compare, et
// on ne fait le travail qu'une fois.
let derniereAdresse = null;
let premierRendu = true;

function adresseCourante() {
  if (monTableau) return "#/moi";
  if (joueur) return "#/j/" + encodeURIComponent(joueur);
  if (choisie) return "#/p/" + choisie.id;
  const fin = filtre === "terminees" ? "/terminees" : "";
  if (famille) return "#/c/" + famille + fin;
  return fin ? "#/terminees" : "#/";
}

function ecrireAdresse() {
  const a = adresseCourante();
  if (a === derniereAdresse) { premierRendu = false; return; }
  derniereAdresse = a;
  if (location.hash !== a) {
    // Au chargement, la promotion choisie d'office n'est pas une navigation :
    // elle ne doit pas s'intercaler dans l'historique, sinon « précédent »
    // ramène sur la même page.
    if (premierRendu) history.replaceState(null, "", a);
    else location.hash = a;
  }
  premierRendu = false;
}

/** Appliquer une adresse : le clic sur un lien, le bouton « précédent ». */
function appliquerAdresse(a) {
  const champQ = document.getElementById("q");
  monTableau = false;

  // Mon tableau de bord. Sans pseudo enregistré l'adresse n'a pas de sens :
  // on demande lequel plutôt que d'afficher une page vide.
  if (a === "#/moi") {
    if (!moi) {
      ouvrirDialogueMoi();
      poserFiltre("live");
      famille = "";
      choisie = null;
      joueur = null;
      surligne = null;
      champQ.value = "";
      rendre();
      return;
    }
    monTableau = true;
    joueur = null;
    choisie = null;
    surligne = moi;
    champQ.value = "";
    fermerSuggestions();
    rendreBarre();
    rendreMoi();
    if (window.matchMedia("(max-width: 900px)").matches) document.body.classList.add("replie");
    return;
  }

  const versJoueur = /^#\/j\/(.+)$/.exec(a);
  if (versJoueur) {
    const demande = decodeURIComponent(versJoueur[1]);
    // L'adresse peut venir d'ailleurs, avec une casse approximative : on
    // retrouve le pseudo tel qu'il est publié.
    const vrai = pseudoExact(demande);
    joueur = vrai;
    surligne = vrai;
    champQ.value = vrai;
    fermerSuggestions();
    rendreBarre();
    rendreJoueur(vrai);
    window.scrollTo(0, 0);
    return;
  }

  joueur = null;
  // Sa ligne reste repérée dans tous les classements qu'il ouvre : c'est
  // la première chose qu'on cherche dans une liste de trois cents noms.
  surligne = moi || null;
  champQ.value = "";

  // `#/c/slots`, `#/c/original/terminees` : une liste entière, partageable.
  const versFamille = /^#\/c\/(slots|original|sports)(\/terminees)?$/.exec(a);
  if (versFamille) {
    famille = versFamille[1];
    poserFiltre(versFamille[2] ? "terminees" : "live");
    choisie = null;
    rendre();
    return;
  }

  const versPromo = /^#\/p\/(.+)$/.exec(a);
  if (versPromo) {
    const id = decodeURIComponent(versPromo[1]);
    // Une promotion terminée a une adresse comme les autres : on bascule
    // l'onglet pour elle, plutôt que de renvoyer sur une page vide.
    let f = jeux.live.find((x) => String(x.id) === id);
    if (f) poserFiltre("live");
    else {
      f = jeux.terminees.find((x) => String(x.id) === id);
      if (f) poserFiltre("terminees");
    }
    if (f) {
      // Une adresse collée peut viser une promotion que la famille en cours
      // masque : c'est la famille qui cède, pas la promotion demandée.
      if (famille && !famillesDe(f).includes(famille)) famille = "";
      choisie = f;
      toutMontrer = false;
      rendreBarre();
      rendreFiche(f);
      if (window.matchMedia("(max-width: 900px)").matches) document.body.classList.add("replie");
      window.scrollTo(0, 0);
      return;
    }
  }

  poserFiltre(a === "#/terminees" ? "terminees" : "live");
  famille = "";
  choisie = null;
  rendre();
}

/**
 * Le pseudo tel qu'il est publié, à partir de ce que dit l'adresse.
 *
 * Une adresse recopiée à la main perd la casse ; `joueursConnus` ne sert pas
 * ici, elle renvoie des paires et s'arrête à quarante suggestions. Un balayage
 * direct coûte moins qu'une vue joueur vide.
 */
function pseudoExact(demande) {
  const cible = pliage(demande);
  for (const f of toutesLesFiches()) {
    for (const l of f.classement?.lignes || []) {
      if (pliage(l.pseudo) === cible) return l.pseudo;
    }
  }
  return demande;
}

function lireAdresse() {
  const a = location.hash || "#/";
  if (a === derniereAdresse) return;
  derniereAdresse = a;
  appliquerAdresse(a);
}

window.addEventListener("hashchange", lireAdresse);

// ── Le thème ─────────────────────────────────────────────────────────────
//
// Trois états, et le choix du lecteur l'emporte toujours. « auto » n'est pas
// un défaut paresseux : c'est le seul qui suive quelqu'un dont le système
// bascule au coucher du soleil.
const THEMES = [
  ["auto", "◐", "theme_auto"],
  ["clair", "☀", "theme_clair"],
  ["sombre", "☾", "theme_sombre"],
];
let themeActuel = "auto";
function poserTheme(nom) {
  const t = THEMES.find((x) => x[0] === nom) || THEMES[0];
  themeActuel = t[0];
  if (t[0] === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t[0]);
  const b = document.getElementById("theme");
  b.textContent = t[1];
  b.title = tr(t[2]);
  b.setAttribute("aria-label", tr(t[2]));
  // Le rangement peut échouer — navigation privée, stockage bloqué — et ce
  // n'est pas une raison pour que le thème ne s'applique pas.
  try { localStorage.setItem("theme", t[0]); } catch (e) { /* tant pis */ }
}
try { poserTheme(localStorage.getItem("theme") || "auto"); } catch (e) { poserTheme("auto"); }
document.getElementById("langue").addEventListener("click", () => {
  poserLangue(langue === "fr" ? "en" : "fr");
});
document.getElementById("theme").addEventListener("click", () => {
  const i = THEMES.findIndex((x) => x[0] === themeActuel);
  poserTheme(THEMES[(i + 1) % THEMES.length][0]);
});

// ── Mon pseudo ───────────────────────────────────────────────────────────
function poserMoi(pseudo) {
  moi = pseudo || "";
  try {
    if (moi) localStorage.setItem("pseudo", moi);
    else localStorage.removeItem("pseudo");

/** Le dialogue : choisir son pseudo parmi ceux que le forum connaît. */
function ouvrirDialogueMoi() {
  const d = document.getElementById("moi-dialogue");
  const champ = document.getElementById("moi-champ");
  const liste = document.getElementById("moi-propositions");
  const oublier = document.getElementById("moi-oublier");
  champ.value = moi;
  oublier.hidden = !moi;

  const proposer = () => {
    const mot = champ.value.trim();
    liste.replaceChildren();
    if (mot.length < 2) return;
    const trouves = joueursConnus(mot);
    if (!trouves.length) {
      liste.append(el("p", { class: "rien",
        text: tr("aucun_joueur_de_ce_nom") }));
      return;
    }
    liste.append(...trouves.slice(0, 12).map(([pseudo, n]) =>
      el("button", { type: "button", onclick: () => { champ.value = pseudo; valider(); } },
        el("span", { text: pseudo }),
        el("span", { class: "compte", text: n + " promo" + (n > 1 ? "s" : "") }))));
  };

  const valider = () => {
    const v = champ.value.trim();
    if (!v) return;
    poserMoi(v);
    d.close();
    fermerMenuMoi();
    if (location.hash === "#/moi") { surligne = moi; rendreMoi(); }
    else location.hash = "#/moi";
  };

  champ.oninput = proposer;
  document.getElementById("moi-form").onsubmit = (ev) => { ev.preventDefault(); valider(); };
  document.getElementById("moi-valider").onclick = (ev) => { ev.preventDefault(); valider(); };
  document.getElementById("moi-annuler").onclick = () => d.close();
  oublier.onclick = () => {
    poserMoi("");
    d.close();
    fermerMenuMoi();
    if (location.hash === "#/moi") location.hash = "#/";
    else rendre();
  };

  proposer();
  d.showModal();
  champ.focus();
  champ.select();
}

/**
 * L'adresse du formulaire de réponse d'un fil.
 *
 * `#replyForm` est une vraie ancre de la page — `<a id="replyForm">`, posée
 * juste avant la zone de réponse, et présente même déconnecté. Un
 * navigateur qui ne la trouve pas se contente d'ouvrir le fil, ce qui est
 * exactement le repli qu'on veut.
 */
function lienReponse(f) {
  if (!f.url) return null;
  return f.url.split("#")[0] + "#replyForm";
}

/**
 * Ce que la promotion paie, en une phrase.
 *
 * La cagnotte seule ne dit pas grand-chose : deux mille dollars partagés
 * entre cinq cents personnes et deux mille pour un seul gagnant ne se
 * jouent pas pareil. Quand le barème est connu on dit le premier prix et
 * le nombre de places ; quand il ne l'est pas, on le dit aussi plutôt que
 * de laisser croire qu'on sait.
 */
function resumePrix(f) {
  const prix = f.regles?.prix || [];
  if (!prix.length) return null;
  const places = prix
    .filter((t) => !t.jusqu_au_bout)
    .reduce((n, t) => n + (t.rang_fin - t.rang_debut + 1), 0);
  const ouvert = prix.some((t) => t.jusqu_au_bout);
  const t = prix[0];

  // Un montant unique sur toutes les places : c'est un forfait par gagnant,
  // et « 1ᵉʳ 30 $ » le dirait mal.
  if (prix.length === 1 && t.rang_debut === 1 && t.rang_fin > 3 && !t.partage && !t.jusqu_au_bout) {
    return tr("par_gagnant", argent(t.montant), nf.format(t.rang_fin));
  }
  const tete = t.partage
    ? tr("a_partager", argent(t.montant))
    : tr("premier_prix", ordinal(1), argent(t.montant));
  if (!places && ouvert) return tete;
  return tete + " · " + tr(pl(places, "place_payante", "places_payantes"),
    nf.format(places) + (ouvert ? "+" : ""));
}

/**
 * Les machines que tout le monde joue, quand le fil ne les dit pas.
 *
 * Quatre promotions imposent des machines précises sans jamais les lier :
 * Bonus Clash passe par des liens raccourcis `sta.ke` sans libellé, Mystery
 * Drop et Mad Ducks ne lient rien du tout. Leurs paris, eux, sont sans
 * équivoque — 98 % sur deux machines, 96 % sur une, 100 % sur une.
 *
 * À l'inverse, une promotion ouverte à toute une catégorie se reconnaît à sa
 * dispersion : « Return of the King » plafonne à 6 % sur sa machine la plus
 * jouée, Temporal Oblivion à 9 %. Le seuil les écarte d'eux-mêmes.
 *
 * C'est une **observation**, pas une règle : affichée comme telle, jamais
 * mélangée aux machines imposées.
 */
function machinesObservees(f) {
  if (f.regles?.exigences?.jeux?.length) return null;
  const compte = new Map();
  let total = 0;
  for (const l of f.classement?.lignes || []) {
    if (!l.jeu) continue;
    // Ni le sportsbook ni le marqueur des paris non identifiés ne sont des
    // machines : « Tous y jouent : sportsbook · Machine inconnue » n'apprend
    // rien à personne.
    const clef = clefJeu(l.jeu);
    if (JEUX_SPORT.has(clef) || clef === "machineinconnue") continue;
    compte.set(l.jeu, (compte.get(l.jeu) || 0) + 1);
    total += 1;
  }
  // Sous dix paris, une machine à 100 % ne veut encore rien dire.
  if (total < 10) return null;

  const ordre = [...compte.entries()].sort((a, b) => b[1] - a[1]);
  const retenues = [];
  let cumul = 0;
  for (const [jeu, n] of ordre) {
    if (n / total < 0.1) break;      // une machine marginale n'est pas imposée
    retenues.push(jeu);
    cumul += n;
    if (cumul / total >= 0.9) break; // le reste est du bruit
    if (retenues.length >= 4) break;
  }
  return cumul / total >= 0.9 && retenues.length ? retenues : null;
}

/** Les exigences d'une promotion, en une ligne. */
function exigencesCourtes(f) {
  const e = f.regles?.exigences || {};
  const bouts = [];
  if (e.multiplicateur_minimum != null) bouts.push(tr("ex_multi", nf.format(e.multiplicateur_minimum)));
  if (e.cote_minimum != null) bouts.push(tr("ex_cote", nf.format(e.cote_minimum)));
  if (e.mise_minimum_usd != null) bouts.push(tr("ex_mise", argent(e.mise_minimum_usd)));
  // Les machines ne sont plus ici : « 4 machines imposées » disait le
  // nombre sans dire lesquelles, alors que c'est la première chose qu'il
  // faut savoir pour jouer. Elles ont leur propre ligne.
  // Les conditions qui disqualifient après coup : mieux vaut les voir avant
  // de poster que découvrir en fin de promotion qu'on n'était pas éligible.
  if (e.participations_par_joueur != null) {
    bouts.push(tr(pl(e.participations_par_joueur, "ex_post_max", "ex_posts_max"),
      e.participations_par_joueur));
  }
  if (e.rang_vip) bouts.push("VIP " + e.rang_vip);
  if (e.kyc_requis) bouts.push(tr("ex_kyc"));
  if (e.achats_de_bonus_interdits) bouts.push(tr("ex_pas_achat"));
  return bouts.join(" · ");
}

/** Une ligne du menu : une promotion à remplir, et où répondre. */
function ligneMenu({ f, faites, max }) {
  const fin = reste(f.fin_le);
  const url = lienReponse(f);
  const detail = exigencesCourtes(f);
  const paie = resumePrix(f);
  const jeux = f.regles?.exigences?.jeux;
  const observees = machinesObservees(f);
  const c = f.classement || {};
  return el(url ? "a" : "div", {
    class: "ligne",
    href: url || null,
    target: url ? "_blank" : null,
    rel: url ? "noopener" : null,
  },
    el("div", { class: "haut-l" },
      el("span", { class: "nom-l", text: f.titre }),
      fin ? el("span", { class: "quand" + (presse(f.fin_le) ? " urgent" : ""), text: fin }) : null),
    // En jeu, et combien sont déjà dedans.
    el("div", { class: "detail" },
      el("span", { class: "pot", text: argent(f.regles?.cagnotte_usd ?? null) }),
      el("span", { text: tr(pl(c.joueurs || 0, "n_joueur_deja", "n_joueurs_deja"), nf.format(c.joueurs || 0)) }),
      faites ? el("span", { text: tr("n_postes", faites, max) }) : null),
    // Comment on gagne, et ce que ça paie.
    el("div", { class: "comment" },
      el("b", { text: TYPES[f.regles?.type_classement] ? tr(TYPES[f.regles.type_classement]) : tr("critere_non_lu") }),
      paie ? [" — ", el("span", { class: "paie", text: paie })] : null,
      !c.classable
        ? el("span", { class: "flou", text: tr("classement_non_calcule_ici") })
        : null),
    // Sur quoi jouer. Rien quand on ne l'a pas lu : annoncer « toutes les
    // machines » alors qu'on a peut-être mal lu enverrait quelqu'un miser
    // sur une machine qui ne compte pas.
    jeux?.length
      ? el("div", { class: "machines" },
          el("span", { class: "eti", text: tr(jeux.length > 1 ? "machines" : "machine") }),
          el("span", { text: jeux.join(" · ") }))
      : observees
        ? el("div", { class: "machines vues" },
            el("span", { class: "eti", text: tr("tous_y_jouent") }),
            el("span", { text: observees.join(" · ") }))
        : null,
    detail ? el("div", { class: "exig", text: detail }) : null,
    url ? el("span", { class: "repondre", text: tr("repondre_sur_le_forum") }) : null);
}

/** Le menu du pseudo : ce qu'il reste à remplir, depuis n'importe où. */
function rendreMenuMoi() {
  const m = document.getElementById("moi-menu");
  const { jamais, partiel } = ceQuiManque(moi);

function fermerMenuMoi() {
  const m = document.getElementById("moi-menu");
  m.hidden = true;
  document.getElementById("moi-bouton").setAttribute("aria-expanded", "false");
}

function basculerMenuMoi() {
  const m = document.getElementById("moi-menu");
  if (!m.hidden) { fermerMenuMoi(); return; }
  rendreMenuMoi();
  m.hidden = false;
  // En étroit le menu est `fixed` : il lui faut sa hauteur de départ, que

document.getElementById("moi-bouton").addEventListener("click", (ev) => {

});
document.addEventListener("click", (ev) => {

  if (!m.hidden && !m.contains(ev.target)) fermerMenuMoi();
});
document.addEventListener("keydown", (ev) => {

});
rendreBoutonMoi();

// ── Le chargement ────────────────────────────────────────────────────────
async function charger() {
  if (window.DONNEES) {
    jeux.live = window.DONNEES.live || [];
    jeux.terminees = window.DONNEES.terminees || [];
    lireAdresse();
    return;
  }
  const barre = document.getElementById("barre");
  barre.replaceChildren(el("p", { class: "vide", style: "padding:16px", text: tr("chargement") }));
  try {
    // Les deux jeux d'un coup : la recherche de joueur couvre les promotions
    // terminées, où se trouvent justement les gains déjà acquis.
    const [a, b] = await Promise.all([
      fetch("/promotions?filtre=live", { cache: "no-store" }).then((r) => r.json()),
      fetch("/promotions?filtre=terminees", { cache: "no-store" }).then((r) => r.json()),
    ]);
    jeux.live = a.promotions || [];
    jeux.terminees = b.promotions || [];
  } catch (e) {
    barre.replaceChildren(el("p", { class: "vide", style: "padding:16px" },
      tr("hub_muet") + " ", el("span", { class: "doux", text: String(e.message) })));
    document.getElementById("vue").replaceChildren();
    return;
  }
  lireAdresse();
}

function rendre() {
  rendreBarre();
  if (joueur) { rendreJoueur(joueur); return; }
  const encore = choisie && fiches().find((f) => f.id === choisie.id);
  if (encore) { montrerFiche(encore, false, true); return; }
  // Plus de promotion choisie d'office : on ouvrait sur celle qui fermait le
  // plus tôt, ce qui donnait à croire qu'elle comptait plus que les autres.
  choisie = null;
  rendreAccueil();
}

/**
 * Ce qui manque à quelqu'un, et ce qu'il lui reste de place.
 *
 * Deux cas distincts, qu'il serait trompeur de mélanger : une promotion où
 * il n'a rien posté, et une où il a posté mais peut encore remettre — huit
 * des dix-neuf promotions en cours annoncent un maximum par joueur, et
 * Temporal Oblivion en autorise cinq.
 */
function ceQuiManque(pseudo) {
  const cible = pliage(pseudo);
  const jamais = [];
  const partiel = [];
  for (const f of jeux.live) {
    const siennes = (f.classement?.lignes || []).filter((l) => pliage(l.pseudo) === cible);
    const max = f.regles?.exigences?.participations_par_joueur;
    if (!siennes.length) jamais.push({ f, faites: 0, max });
    else if (max != null && siennes.length < max) partiel.push({ f, faites: siennes.length, max });
  }
  const parEcheance = (a, b) =>
    (Date.parse(a.f.fin_le || "") || Infinity) - (Date.parse(b.f.fin_le || "") || Infinity);
  return { jamais: jamais.sort(parEcheance), partiel: partiel.sort(parEcheance) };
}

/** Une carte « il te manque celle-ci », avec de quoi agir. */
function carteManque({ f, faites, max }) {
  const e = f.regles?.exigences || {};
  const fin = reste(f.fin_le);
  const puces = [];
  if (e.jeux?.length) puces.push(puce(tr("machine"), e.jeux.join(" · ")));
  if (e.multiplicateur_minimum != null) puces.push(puce(tr("p_multi"), "≥ " + nf.format(e.multiplicateur_minimum) + "x"));
  if (e.mise_minimum_usd != null) puces.push(puce(tr("p_mise"), "≥ " + argent(e.mise_minimum_usd)));
  if (e.cote_minimum != null) puces.push(puce(tr("p_cote"), "≥ " + nf.format(e.cote_minimum)));
  if (e.bet_id_unique) puces.push(puce("Bet ID", tr("un_seul")));
  if (e.kyc_requis) puces.push(puce(tr("p_identite"), tr("verifiee")));

  return el("div", { class: "cas" + (faites ? " reste" : "") },
    el("div", { class: "haut-m" },
      el("span", { text: f.categorie || "—" }),
      fin ? el("span", { class: "quand" + (presse(f.fin_le) ? " urgent" : ""), text: fin }) : null),
    el("div", { class: "nom-m" },
      f.url
        ? el("a", { href: f.url, target: "_blank", rel: "noopener", text: f.titre })
        : el("span", { text: f.titre })),
    el("div", {},
      el("span", { class: "gain", text: argent(f.regles?.cagnotte_usd ?? null) }),
      faites
        ? el("span", { class: "encore", text: tr("deja_sur_reste", faites, max, max - faites) })
        : null),
    puces.length ? el("div", { class: "regles" }, puces) : null,
    // Une seule action, la seule qui existe vraiment : aller au fil et
    // poster soi-même. Il y avait ici un champ « colle ton Bet ID » avec un
    // bouton Copier — on y collait ce qu'on venait de copier pour le
    // recopier. Rien ne peut partir d'ici vers le forum.
    f.url
      ? el("div", { class: "agir" },
          el("a", { class: "aller", href: f.url, target: "_blank", rel: "noopener",
                    text: tr("ouvrir_le_fil_et_poster") }))
      : null);
}

/**
 * Le tableau de bord de quelqu'un : ce qui lui manque d'abord, ce qu'il a
 * déjà ensuite. L'ordre compte — on vient voir ce qu'on peut encore jouer,
 * pas admirer ce qu'on a joué.
 */
function rendreMoi() {
  const vue = document.getElementById("vue");
  const cible = pliage(moi);
  const trouvees = [];
  for (const [ou, liste] of [["en cours", jeux.live], ["terminée", jeux.terminees]]) {
    for (const f of liste) {
      for (const l of f.classement?.lignes || []) {
        if (pliage(l.pseudo) === cible) trouvees.push({ f, l, ou });
      }
    }
  }
  const gains = trouvees.reduce((s, x) => s + (x.l.prix_estime || 0), 0);
  const payantes = trouvees.filter((x) => x.l.prix_estime).length;
  const { jamais, partiel: partielles } = ceQuiManque(moi);
  const potManque = jamais.reduce((s, x) => s + (x.f.regles?.cagnotte_usd || 0), 0);

  const morceaux = [el("div", { class: "entete accueil" },
    el("div", { class: "haut" },
      el("div", { class: "titraille" },
        el("p", { class: "fil", text: tr("mon_tableau_de_bord") }),
        el("h2", { text: moi }),
        el("p", { class: "critere" },
          tr(pl(trouvees.length, "n_participation", "n_participations"), nf.format(trouvees.length)) +
          " · " + tr(pl(payantes, "n_place_payante", "n_places_payantes"), nf.format(payantes)) +
          " · " + tr(pl(jamais.length, "n_jamais_tentee", "n_jamais_tentees"), nf.format(jamais.length)),
          " · ",
          el("button", { class: "lien-promo", onclick: ouvrirDialogueMoi }, "changer de pseudo"))),
      el("div", { class: "pot" },
        el("span", { class: "somme", text: argent(gains) }),
        el("span", { class: "etiquette", text: tr("gains_estimes") }))))];

  if (jamais.length) {
    morceaux.push(el("h3", { class: "section",
      text: tr("manque_titre", argent(potManque)) }));
    morceaux.push(el("div", { class: "manque" }, jamais.map(carteManque)));
  }
  if (partielles.length) {
    morceaux.push(el("h3", { class: "section", text: tr("ou_il_te_reste_de") }));
    morceaux.push(el("div", { class: "manque" }, partielles.map(carteManque)));
  }
  if (!jamais.length && !partielles.length) {
    morceaux.push(el("h3", { class: "section", text: tr("ce_qui_te_manque2") }));

  if (trouvees.length) {

/** Une carte de promotion, pour les rangées de l'accueil. */
function carteP(f) {
  const c = f.classement || {};
  const fin = reste(f.fin_le);
  const d = Date.parse(f.regles?.debut_le || f.ouvert_le || "");
  const t = Date.parse(f.fin_le || "");
  const part = isFinite(d) && isFinite(t) && t > d
    ? Math.min(1, Math.max(0, (Date.now() - d) / (t - d))) : null;
  return el("a", { class: "carte-p", href: "#/p/" + f.id },
    el("div", { class: "haut-c" },
      el("span", { class: "ou", text: f.categorie || "—" }),
      fin ? el("span", { class: "quand" + (presse(f.fin_le) ? " urgent" : ""), text: fin }) : null),
    el("div", { class: "nom", text: f.titre }),
    el("div", { class: "chiffres" },
      el("span", { class: "somme", text: argent(f.regles?.cagnotte_usd ?? null) }),
      el("span", { text: tr("n_entrees", nf.format(c.participations || 0)) }),
      el("span", { text: tr(pl(c.joueurs || 0, "n_joueur", "n_joueurs"), nf.format(c.joueurs || 0)) })),
    part != null
      ? el("div", { class: "mini" + (presse(f.fin_le) ? " presse" : "") },
